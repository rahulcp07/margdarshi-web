<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#174a7e" />
<meta name="description" content="MARGDARSHI — National Highway administration and project reporting system." />
<title>MARGDARSHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --primary: #174a7e;
  --primary-dark: #0f3a66;
  --teal: #197a8c;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #64748b;
  --border: #dce3ea;
  --green: #16855b;
  --amber: #c66a05;
  --red: #d13c3c;
  --blue: #1f65b5;
  --shadow: 0 8px 24px rgba(23, 74, 126, .08);
  font-family: Inter, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .72; }
.icon { flex: 0 0 auto; }

.loading-screen { min-height: 100vh; display: grid; place-content: center; gap: 14px; text-align: center; color: var(--muted); }
.spinner { width: 17px; height: 17px; display: inline-block; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 999px; animation: spin .75s linear infinite; }
.spinner.dark { width: 28px; height: 28px; margin: auto; border-color: #d7e1eb; border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

.auth-page { min-height: 100vh; display: grid; grid-template-columns: minmax(460px, 1.15fr) minmax(420px, .85fr); }
.auth-brand-panel { position: relative; overflow: hidden; padding: 38px 52px; display: flex; flex-direction: column; color: #fff; background: linear-gradient(145deg, #0e3d6f, #176b91); }
.auth-brand-panel::before, .auth-brand-panel::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); }
.auth-brand-panel::before { width: 560px; height: 560px; right: -230px; top: -210px; }
.auth-brand-panel::after { width: 360px; height: 360px; left: -150px; bottom: -180px; }
.brand-lockup { display: flex; align-items: center; gap: 12px; min-width: 240px; }
.brand-lockup .emblem { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,.38); border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
.brand-lockup strong { display: block; font-size: 21px; letter-spacing: .025em; }
.brand-lockup span { display: block; font-size: 12px; opacity: .88; margin-top: 3px; }
.auth-intro { z-index: 1; max-width: 650px; margin: auto 0; }
.eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.auth-intro .eyebrow { color: #9ee0eb; }
.auth-intro h1 { font-size: clamp(34px, 4vw, 56px); line-height: 1.08; letter-spacing: -.04em; margin: 0 0 22px; }
.auth-intro > p:not(.eyebrow) { max-width: 600px; color: rgba(255,255,255,.82); font-size: 17px; line-height: 1.7; }
.auth-feature-grid { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 12px; margin-top: 30px; max-width: 520px; }
.auth-feature-grid div { display: flex; align-items: center; gap: 10px; padding: 13px 15px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 13px; font-weight: 600; }
.auth-department { z-index: 1; font-size: 12px; opacity: .74; }
.auth-form-panel { padding: 36px; display: grid; place-items: center; background: linear-gradient(180deg, #fbfcfe, #f3f6f9); }
.auth-card { width: min(100%, 440px); padding: 36px; border: 1px solid var(--border); background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.auth-card-heading h2 { margin: 0; font-size: 29px; letter-spacing: -.02em; }
.auth-card-heading > p:last-child { margin: 8px 0 26px; color: var(--muted); font-size: 14px; }
.mobile-brand { display: none; }
label { display: grid; gap: 7px; color: #334155; font-size: 13px; font-weight: 600; }
input, select, textarea { width: 100%; border: 1px solid #cfd9e3; border-radius: 8px; padding: 11px 12px; color: var(--text); background: #fff; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23,74,126,.10); }
#login-form { display: grid; gap: 18px; }
.btn { min-height: 42px; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 5px 14px rgba(23,74,126,.18); }
.btn.primary:hover { background: var(--primary-dark); }
.btn.secondary { color: var(--primary); border-color: #cbd8e4; background: #fff; }
.btn.full { width: 100%; }
.auth-divider { display: flex; align-items: center; gap: 10px; margin: 24px 0 15px; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: #e4e9ef; }
.preview-link { display: block; margin: 14px auto 0; border: 0; background: transparent; color: var(--teal); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.auth-security { margin: 20px 0 0; text-align: center; color: #94a3b8; font-size: 11px; line-height: 1.5; }
.form-error { min-height: 16px; margin: 0; color: var(--red); font-size: 12px; font-weight: 500; }

.password-field { position: relative; }
.password-field input { padding-right: 72px; }
.password-toggle { position: absolute; right: 8px; bottom: 6px; min-height: 30px; border: 0; border-radius: 6px; padding: 4px 8px; background: transparent; color: var(--primary); font-size: 12px; font-weight: 700; }
.password-toggle:hover { background: #edf3f9; }
.field-help { display: block; margin-top: -6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.otp-label { display: grid; gap: 8px; color: #334155; font-size: 13px; font-weight: 600; }
.otp-boxes { display: grid; grid-template-columns: repeat(8, minmax(34px, 1fr)); gap: 7px; }
.otp-box {
  min-width: 0;
  height: 48px;
  padding: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.otp-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23,74,126,.10); }
@media (max-width: 520px) {
  .otp-boxes { gap: 4px; }
  .otp-box { height: 44px; font-size: 18px; }
}

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 245px 1fr; grid-template-rows: 96px 1fr; }
.topbar { position: sticky; top: 0; z-index: 20; grid-column: 1 / -1; display: grid; grid-template-columns: 275px minmax(260px, 740px) 1fr; align-items: center; gap: 28px; padding: 0 34px 0 24px; background: linear-gradient(90deg, #10447a, #07558e); color: #fff; box-shadow: 0 2px 7px rgba(15,58,102,.18); }
.global-search { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 10px; background: #fff; color: var(--muted); box-shadow: 0 5px 16px rgba(0,0,0,.13); }
.global-search input { border: 0; box-shadow: none; padding: 0; background: transparent; }
.global-search kbd { padding: 4px 7px; border: 1px solid #dce3ea; border-radius: 5px; color: #64748b; background: #f6f8fa; white-space: nowrap; }
.global-search{position:relative}
.global-search-results{position:absolute;left:0;right:0;top:62px;z-index:80;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(15,23,42,.20);overflow:hidden;max-height:430px;overflow-y:auto;color:#0f172a}
.global-search-results[hidden]{display:none}
.global-search-result{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--border);background:#fff;text-align:left;cursor:pointer}
.global-search-result:last-child{border-bottom:0}
.global-search-result:hover,.global-search-result.active{background:#f0fdfa}
.global-search-result strong,.global-search-result span,.global-search-result small{display:block}
.global-search-result strong{font-size:12px;color:#0f172a}
.global-search-result span{margin-top:3px;font-size:10px;color:#475569}
.global-search-result small{font-size:9px;color:#64748b;text-align:right}
.global-search-empty{padding:22px;text-align:center;color:#64748b;font-size:11px}.search-highlight{outline:4px solid #14b8a6!important;outline-offset:3px!important;background:#ccfbf1!important;box-shadow:0 0 0 7px rgba(20,184,166,.16)!important;transition:.2s}.calendar-target-highlight{outline:4px solid #8b5cf6!important;outline-offset:3px!important;background:#f5f3ff!important;box-shadow:0 0 0 7px rgba(139,92,246,.16)!important;transition:.2s}
.global-search-section{padding:7px 14px;background:#f8fafc;color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
@media(max-width:620px){.global-search-results{position:fixed;left:10px;right:10px;top:70px;max-height:60vh}}

.topbar-actions { justify-self: end; display: flex; align-items: center; gap: 18px; }
.app-build-marker { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; color: #fff; background: rgba(255,255,255,.12); font-size: 10px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; user-select: none; pointer-events: none; }
.notification-button { position: relative; display: grid; place-items: center; border: 0; background: transparent; color: #fff; }
.notification-button span { position: absolute; top: -9px; right: -8px; min-width: 19px; height: 19px; display: grid; place-items: center; border: 2px solid #0b5188; border-radius: 999px; background: #ef4444; font-size: 10px; font-weight: 700; }
.notification-button .notification-zero { display: none; }



.dashboard-page{display:grid;gap:22px}.dashboard-hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.dashboard-hero h1{margin:0;font-size:35px;letter-spacing:-.035em}.dashboard-hero p{margin:8px 0 0;color:var(--muted)}.dashboard-actions{display:flex;gap:10px}.dashboard-kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.dashboard-kpi,.dashboard-card{border:1px solid var(--border);border-radius:12px;background:#fff}.dashboard-kpi{padding:18px;cursor:pointer;box-shadow:0 12px 28px rgba(15,23,42,.05)}.dashboard-kpi span,.dashboard-kpi strong,.dashboard-kpi small{display:block}.dashboard-kpi span,.dashboard-kpi small{color:var(--muted);font-size:10px}.dashboard-kpi strong{margin-top:7px;font-size:29px}.dashboard-kpi small{margin-top:6px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:16px}.dashboard-card{padding:18px}.dashboard-card-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.dashboard-card-heading h2{margin:0;font-size:17px}.dashboard-card-heading span{color:var(--muted);font-size:10px}.dashboard-list,.dashboard-projects{display:grid;gap:9px}.dashboard-list-item,.dashboard-project-row{padding:11px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer}.dashboard-list-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.dashboard-list-item strong,.dashboard-list-item span,.dashboard-list-item small,.dashboard-project-row strong,.dashboard-project-row span{display:block}.dashboard-list-item span,.dashboard-list-item small,.dashboard-project-row span{margin-top:3px;color:var(--muted);font-size:9px}.dashboard-list-item .right{text-align:right}.dashboard-project-row header{display:flex;justify-content:space-between;gap:12px}.dashboard-progress{height:7px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px}.dashboard-progress i{display:block;height:100%;background:#0f5a91}.dashboard-empty{padding:24px;text-align:center;color:var(--muted)}.quick-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.quick-link{padding:13px;border:1px solid var(--border);border-radius:9px;background:#f8fafc;text-align:left;cursor:pointer}.quick-link strong,.quick-link span{display:block}.quick-link span{margin-top:4px;color:var(--muted);font-size:9px}.dashboard-kpi:focus-visible,.dashboard-list-item:focus-visible,.dashboard-project-row:focus-visible{outline:3px solid #0f766e;outline-offset:3px}@media(max-width:1050px){.dashboard-kpis{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:620px){.dashboard-kpis,.quick-links{grid-template-columns:1fr}}

.inspections-page { display: grid; gap: 22px; }
.inspection-list { display: grid; gap: 12px; }
.inspection-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.inspection-item.critical { border-left: 4px solid #dc2626; }
.inspection-item.high { border-left: 4px solid #f97316; }
.inspection-item h3 { margin: 8px 0 7px; font-size: 15px; }
.inspection-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
.inspection-observation { margin: 9px 0 0; color: #475569; font-size: 12px; line-height: 1.55; }
.inspection-side { min-width: 190px; text-align: right; }
.inspection-side strong, .inspection-side span { display: block; }
.inspection-side span { margin-top: 5px; color: var(--muted); font-size: 10px; }
.inspection-actions { display: flex; justify-content: flex-end; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.inspection-photo-list { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.inspection-photo-button { border: 1px solid var(--border); background: #f8fafc; border-radius: 7px; padding: 6px 8px; font-size: 10px; cursor: pointer; }
@media (max-width:720px){.inspection-item{grid-template-columns:1fr}.inspection-side{text-align:left;min-width:0}.inspection-actions{justify-content:flex-start}}

.calendar-page { display: grid; gap: 22px; }
.calendar-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.calendar-nav { display: flex; align-items: center; gap: 9px; }
.calendar-nav h2 { min-width: 180px; margin: 0; text-align: center; font-size: 19px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }

async function ensureSession() {
  let session = getSession();
  if (!session) return null;
  const expiresAtMs = (session.expires_at || 0) * 1000;
  if (expiresAtMs && expiresAtMs - Date.now() < 60_000) {
    try {
      session = await refreshSession(session);
    } catch {
      setSession(null);
      return null;
    }
  }
  return session;
}

const CORRESPONDENCE_BUCKET = "correspondence-attachments";
const MAX_ATTACHMENT_BYTES = 10 * 1024 * 1024;
const ALLOWED_ATTACHMENT_TYPES = new Set(["application/pdf", "image/jpeg", "image/png", "image/webp"]);

function safeStorageFilename(filename) {
  const dot = filename.lastIndexOf(".");
  const base = (dot > 0 ? filename.slice(0, dot) : filename)
    .normalize("NFKD")
    .replace(/[^\w.-]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    .slice(0, 80) || "attachment";
  const ext = dot > 0 ? filename.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, "") : "";
  return `${base}${ext}`;
}

function validateCorrespondenceAttachment(file) {
  if (!file) return;
  if (!ALLOWED_ATTACHMENT_TYPES.has(file.type)) {
    throw new Error("Only PDF, JPG, PNG and WEBP files are allowed.");
  }
  if (file.size > MAX_ATTACHMENT_BYTES) {
    throw new Error("Attachment must not exceed 10 MB.");
  }
}

async function uploadCorrespondenceAttachment(file, projectId, correspondenceId) {
  validateCorrespondenceAttachment(file);
  const session = await ensureSession();
  if (!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const filename = safeStorageFilename(file.name);
  const path = `${projectId}/${correspondenceId}/${Date.now()}-${filename}`;
  const response = await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/${CORRESPONDENCE_BUCKET}/${encodeURI(path)}`, {
    method: "POST",
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      Authorization: `Bearer ${session.access_token}`,
      "Content-Type": file.type,
      "x-upsert": "false",
      "cache-control": "3600",
    },
    body: file,
  });
  if (!response.ok) {
    let message = "Attachment upload failed.";
    try {
      const result = await response.json();
      message = result.message || result.error || message;
    } catch {}
    throw new Error(message);
  }
  return {
    attachment_path: path,
    attachment_name: file.name,
    attachment_size_bytes: file.size,
    attachment_mime_type: file.type,
  };
}

async function openCorrespondenceAttachment(record) {
  if (!record?.attachment_path) return;
  const session = await ensureSession();
  if (!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const response = await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/authenticated/${CORRESPONDENCE_BUCKET}/${encodeURI(record.attachment_path)}`, {
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      Authorization: `Bearer ${session.access_token}`,
    },
  });
  if (!response.ok) {
    let message = "Unable to open attachment.";
    try {
      const result = await response.json();
      message = result.message || result.error || message;
    } catch {}
    throw new Error(message);
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const opened = window.open(url, "_blank", "noopener,noreferrer");
  if (!opened) {
    const link = document.createElement("a");
    link.href = url;
    link.download = record.attachment_name || "attachment";
    link.click();
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function formatFileSize(bytes) {
  const value = Number(bytes || 0);
  if (!value) return "";
  if (value < 1024 * 1024) return `${(value / 1024).toFixed(0)} KB`;
  return `${(value / (1024 * 1024)).toFixed(1)} MB`;
}

function escapeHtml(value = "") {
  return String(value).replace(/[&<>'"]/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
  })[char]);
}

function formatDate(value) {
  if (!value) return "—";
  return new Intl.DateTimeFormat("en-IN", { day: "2-digit", month: "short", year: "numeric" }).format(new Date(value));
}

function formatMoneyCrore(value) {
  if (value === null || value === undefined || value === "") return "—";
  return `₹${new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(Number(value))} crore`;
}

function healthClass(label) {
  const normalized = (label || "").toLowerCase();
  if (normalized.includes("healthy") || normalized.includes("completed")) return "healthy";
  if (normalized.includes("delay") || normalized.includes("critical")) return "delayed";
  if (normalized.includes("attention") || normalized.includes("pending")) return "attention";
  if (normalized.includes("draft") || normalized.includes("not started")) return "draft";
  return "progress";
}

function showToast(message, type = "success") {
  document.querySelector(".toast")?.remove();
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("visible"));
  setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => toast.remove(), 250);
  }, 3200);
}

function setButtonLoading(button, loading, label = "Please wait...") {
  if (!button) return;
  if (loading) {
    button.dataset.original = button.innerHTML;
    button.disabled = true;
    button.innerHTML = `<span class="spinner"></span>${label}`;
  } else {
    button.disabled = false;
    button.innerHTML = button.dataset.original || button.innerHTML;
  }
}

function appHeader() {
  const name = escapeHtml(state.profile?.full_name || "MARGDARSHI User");

  return `<header class="topbar">
    <div class="brand-lockup"><div class="emblem">NH</div><div><strong>MARGDARSHI</strong><span>National Highway Division Dhule</span></div></div>
    <div class="global-search">${icon("search", 19)}<input id="global-search-input" aria-label="Global search" autocomplete="off" placeholder="Search projects, letters, actions, inspections..." /><kbd>Ctrl K</kbd><div id="global-search-results" class="global-search-results" hidden></div></div>

function projectMetrics(projects) {
  const construction = projects.filter((p) => p.status === "construction").length;
  const pending = projects.reduce((sum, p) => sum + Number(p.pending_actions_count || 0), 0);
  const completed = projects.filter((p) => ["completed", "closed", "maintenance"].includes(p.status)).length;
  return [
    ["folder", "Total Projects", projects.length, "blue"],
    ["construction", "Under Construction", construction, "teal"],
    ["clipboard", "Pending Actions", pending, "amber"],
    ["check", "Completed / Maintenance", completed, "green"],
  ];
}

function filteredProjects() {
  const { query, highway, status, office } = state.filters;
  return state.projects.filter((project) => {
    const searchText = `${project.project_name} ${project.project_code || ""} ${project.highway_number || ""}`.toLowerCase();
    return (!query || searchText.includes(query.toLowerCase()))
      && (highway === "all" || project.highway_number === highway)
      && (status === "all" || project.status === status)
      && (office === "all" || project.implementing_office_name === office);
  });
}

function progressBar(value) {
  const percentage = Math.min(100, Math.max(0, Number(value || 0)));
  return `<div class="progress-cell"><strong>${percentage.toFixed(0)}%</strong><div class="progress-track"><span style="width:${percentage}%"></span></div></div>`;
}

function projectRows(projects) {
  if (!projects.length) {
    return `<div class="empty-state">${icon("projects", 42)}<h3>No matching projects</h3><p>Adjust the filters or add a new project.</p></div>`;
  }
  return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Project</th><th>Highway</th><th>Stage</th><th>Progress</th><th>Health</th><th>Updated</th><th></th></tr></thead><tbody>${projects.map((project) => `
    <tr data-project-id="${project.id}" tabindex="0">
      <td><strong>${escapeHtml(project.project_name)}</strong><span>${escapeHtml(project.project_code || project.description || "")}</span></td>
      <td>${escapeHtml(project.highway_number || "—")}</td>
      <td><strong>${escapeHtml(project.status_label || project.status)}</strong><span>${escapeHtml(project.mode || "")}</span></td>
      <td>${progressBar(project.physical_progress_pct)}</td>
      <td><span class="status-badge ${healthClass(project.health_label)}"><i></i>${escapeHtml(project.health_label || "In Progress")}</span></td>
      <td><strong>${formatDate(project.updated_at)}</strong><span>${escapeHtml(state.profile?.full_name || "MARGDARSHI")}</span></td>
      <td><button class="icon-button row-menu" aria-label="Project actions">${icon("menu")}</button></td>
    </tr>`).join("")}</tbody></table></div>`;
}

  const pending = users.filter((user) => user.account_status === "pending").length;
  const active = users.filter((user) => user.is_active).length;
  const admins = users.filter((user) => user.role === "admin").length;
  const additional = state.assignments.filter((item) => item.is_active && !item.is_primary).length;
  return `<div class="app-shell">${appHeader()}${sidebar("admin")}
    <main class="main-content admin-page">
      <div class="breadcrumb"><span>Dashboard</span><b>/</b>Administration</div>
      <div class="admin-heading"><div><h1>Administration</h1><p>Approve users, assign access levels, offices and additional-charge posts.</p></div></div>
      <section class="admin-metrics">
        <div class="admin-metric"><span>Total users</span><strong>${users.length}</strong></div>
        <div class="admin-metric"><span>Pending approval</span><strong>${pending}</strong></div>
        <div class="admin-metric"><span>Active users</span><strong>${active}</strong></div>
        <div class="admin-metric"><span>Additional charges</span><strong>${additional}</strong></div>
      </section>
      <section class="admin-card">
        <div class="admin-card-heading"><div><h2>User access and approval</h2><p>Changes take effect the next time the user refreshes or signs in.</p></div><span class="status-pill approved">${admins} administrator${admins === 1 ? "" : "s"}</span></div>
        <div class="admin-table-scroll"><table class="admin-table"><thead><tr><th>User</th><th>Designation</th><th>Office</th><th>Access role</th><th>Approval</th><th>Active</th><th>Posts</th><th>Actions</th></tr></thead><tbody>
          ${users.map((user) => `<tr data-user-row="${user.id}">
            <td><strong>${escapeHtml(user.full_name || "New User")}</strong><span>${escapeHtml(user.email || "Email unavailable")}</span></td>
            <td><select data-field="designation">${designationOptions(user.designation || "")}</select></td>
            <td><select data-field="office_id">${officeOptions(user.office_id || "")}</select></td>
            <td><select data-field="role">${roleOptions(user.role)}</select></td>
            <td><select data-field="account_status">${statusOptions(user.account_status)}</select><span class="status-pill ${user.account_status}">${user.account_status}</span></td>
            <td><input data-field="is_active" type="checkbox" ${user.is_active ? "checked" : ""} aria-label="Active user" /></td>
            <td><span>${escapeHtml(assignmentSummary(user.id))}</span></td>
            <td><div class="admin-actions"><button class="btn primary save-user-button" data-user-id="${user.id}">Save</button><button class="btn secondary add-charge-button" data-user-id="${user.id}" data-user-name="${escapeHtml(user.full_name || "User")}">Add post</button></div></td>
          </tr>`).join("")}
        </tbody></table></div>
      </section>
      <section class="admin-card">
        <div class="admin-card-heading"><div><h2>Current post assignments</h2><p>Primary and additional-charge assignments retained for audit and role switching.</p></div></div>
        <div class="assignment-list" style="padding:18px 20px;">
          ${state.assignments.length ? state.assignments.map((item) => {
            const user = users.find((user) => user.id === item.user_id);
            const office = state.offices.find((office) => office.id === item.office_id);
            return `<div class="assignment-item"><div><strong>${escapeHtml(user?.full_name || "User")} — ${escapeHtml(item.designation)}</strong><span>${escapeHtml(office?.name || "Office")} · ${item.is_primary ? "Primary/Substantive" : "Additional charge"}${item.effective_from ? ` · From ${formatDate(item.effective_from)}` : ""}${item.effective_to ? ` to ${formatDate(item.effective_to)}` : ""}${item.order_reference ? ` · Order: ${escapeHtml(item.order_reference)}` : ""}</span></div><button class="btn secondary assignment-toggle" data-assignment-id="${item.id}" data-next-active="${item.is_active ? "false" : "true"}">${item.is_active ? "Deactivate" : "Reactivate"}</button></div>`;
          }).join("") : `<div class="empty-state"><h3>No assignments recorded</h3><p>Add a primary or additional-charge post from the user table.</p></div>`}
        </div>
      </section>
      <section class="admin-card">
        <div class="admin-card-heading"><div><h2>Official office and organisation directory</h2><p>Frequently used entries appear first in correspondence dropdowns; all others are alphabetical.</p></div><button class="btn primary" id="add-directory-button">${icon("plus")}Add entry</button></div>
        <div style="padding:18px 20px;">${directoryEntityCards()}</div>
      </section>
      ${jurisdictionSection()}
    </main>
    ${directoryDialog()}
    <dialog id="assignment-dialog" class="modal compact-modal"><form id="assignment-form" class="modal-card" novalidate>
      <div class="modal-heading"><div><p class="eyebrow">User assignment</p><h2>Add post / additional charge</h2><p id="assignment-user-label"></p></div><button class="icon-button" type="button" data-dialog-close>${icon("close")}</button></div>

        <label>Effective to<input id="assignment-to" type="date" /></label>

async function renderAdministration() {
  if (state.profile?.role !== "admin") {
    showToast("Administrator access is required.", "error");
    location.hash = "#projects";
    return;
  }
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading administration...</p></div>`;
  try {
    [state.adminUsers, state.assignments, state.directoryEntities, state.projectJurisdictions] = await Promise.all([getAdminUsers(), getUserAssignments(), getDirectoryEntities(true), getProjectJurisdictions()]);
    root.innerHTML = administrationTemplate();
    bindAdministrationEvents();
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p><button class="btn primary" id="back-admin-error">Back to projects</button></div>`;
    document.querySelector("#back-admin-error")?.addEventListener("click", () => location.hash = "#projects");
  }
}

function bindAdministrationEvents() {
  bindCommonEvents();
  document.querySelectorAll(".save-user-button").forEach((button) => button.addEventListener("click", async () => {
    const row = button.closest("tr");
    const userId = button.dataset.userId;
    const officeId = row.querySelector('[data-field="office_id"]').value || null;
    const officeName = state.offices.find((office) => office.id === officeId)?.name || null;
    const payload = {
      designation: row.querySelector('[data-field="designation"]').value || null,
      office_id: officeId,
      office_name: officeName,
      role: row.querySelector('[data-field="role"]').value,
      account_status: row.querySelector('[data-field="account_status"]').value,
      is_active: row.querySelector('[data-field="is_active"]').checked,
    };
    if (payload.account_status === "approved") {
      payload.approved_at = new Date().toISOString();
      payload.approved_by = state.session?.user?.id || null;
    }
    setButtonLoading(button, true, "Saving...");
    try {
      await updateAdminUser(userId, payload);
      showToast("User access updated.");
      await renderAdministration();
    } catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  }));

  const dialog = document.querySelector("#assignment-dialog");
  document.querySelectorAll(".add-charge-button").forEach((button) => button.addEventListener("click", () => {
    document.querySelector("#assignment-user-id").value = button.dataset.userId;
    document.querySelector("#assignment-user-label").textContent = `Assigning a post to ${button.dataset.userName}`;
    document.querySelector("#assignment-form").reset();
    document.querySelector("#assignment-user-id").value = button.dataset.userId;
    dialog.showModal();
  }));

  document.querySelector("#assignment-form")?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#assignment-save");
    const error = document.querySelector("#assignment-error");
    const type = document.querySelector("#assignment-type").value;
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      await createUserAssignment({
        user_id: document.querySelector("#assignment-user-id").value,
        designation: document.querySelector("#assignment-designation").value,
        office_id: document.querySelector("#assignment-office").value,
        assignment_type: type,
        is_primary: type === "substantive",
        effective_from: document.querySelector("#assignment-from").value || null,
        effective_to: document.querySelector("#assignment-to").value || null,
        order_reference: document.querySelector("#assignment-order").value.trim() || null,
        is_active: true,
      });
      dialog.close(); showToast("Post assignment saved."); await renderAdministration();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelectorAll(".assignment-toggle").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await setAssignmentActive(button.dataset.assignmentId, button.dataset.nextActive === "true"); showToast("Assignment updated."); await renderAdministration(); }
    catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  }));

  const directoryDialogElement = document.querySelector("#directory-dialog");
  const resetDirectoryForm = () => {
    document.querySelector("#directory-form")?.reset();
    document.querySelector("#directory-id").value = "";
    document.querySelector("#directory-dialog-title").textContent = "Add office / organisation";
    document.querySelector("#directory-order").value = "999";
    document.querySelector("#directory-active").checked = true;
    document.querySelector("#directory-error").textContent = "";
  };

  document.querySelector("#add-directory-button")?.addEventListener("click", () => {
    resetDirectoryForm();
    directoryDialogElement.showModal();
  });

  document.querySelectorAll(".edit-directory-button").forEach((button) => button.addEventListener("click", () => {
    const entity = state.directoryEntities.find((item) => item.id === button.dataset.directoryId);
    if (!entity) return;
    resetDirectoryForm();
    document.querySelector("#directory-dialog-title").textContent = "Edit office / organisation";
    document.querySelector("#directory-id").value = entity.id;
    document.querySelector("#directory-name").value = entity.name || "";
    document.querySelector("#directory-short-name").value = entity.short_name || "";
    document.querySelector("#directory-category").value = entity.category || "other";
    document.querySelector("#directory-email").value = entity.email || "";
    document.querySelector("#directory-phone").value = entity.phone || "";
    document.querySelector("#directory-address").value = entity.address || "";
    document.querySelector("#directory-order").value = entity.display_order ?? 999;
    document.querySelector("#directory-frequent").checked = Boolean(entity.is_frequent);
    document.querySelector("#directory-active").checked = Boolean(entity.is_active);
    document.querySelector("#directory-remarks").value = entity.remarks || "";
    directoryDialogElement.showModal();
  }));

  document.querySelector("#directory-form")?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#directory-save");
    const error = document.querySelector("#directory-error");
    const id = document.querySelector("#directory-id").value;
    const value = (selector) => document.querySelector(selector)?.value?.trim() || null;
    const payload = {
      name: value("#directory-name"),
      short_name: value("#directory-short-name"),
      category: value("#directory-category") || "other",
      email: value("#directory-email"),
      phone: value("#directory-phone"),
      address: value("#directory-address"),
      display_order: Number(document.querySelector("#directory-order").value || 999),
      is_frequent: document.querySelector("#directory-frequent").checked,
      is_active: document.querySelector("#directory-active").checked,
      remarks: value("#directory-remarks"),
    };
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      if (id) await updateDirectoryEntity(id, payload);
      else await createDirectoryEntity(payload);
      directoryDialogElement.close();
      showToast(id ? "Directory entry updated." : "Directory entry added.");
      await renderAdministration();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelectorAll(".toggle-directory-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await updateDirectoryEntity(button.dataset.directoryId, { is_active: button.dataset.nextActive === "true" }); showToast("Directory entry updated."); await renderAdministration(); }
    catch (error) { showToast(error.message, "error"); } finally { setButtonLoading(button, false); }
  }));

  const jurisdictionDialog = document.querySelector("#jurisdiction-dialog");
  document.querySelector("#add-jurisdiction-button")?.addEventListener("click",()=>jurisdictionDialog.showModal());
  document.querySelector("#jurisdiction-form")?.addEventListener("submit",async(event)=>{event.preventDefault();const form=event.currentTarget;if(!form.checkValidity()){form.reportValidity();return;}const button=document.querySelector("#jurisdiction-save");const error=document.querySelector("#jurisdiction-error");setButtonLoading(button,true,"Saving...");error.textContent="";try{await createProjectJurisdiction({user_id:document.querySelector("#jurisdiction-user").value,project_id:document.querySelector("#jurisdiction-project").value,access_type:document.querySelector("#jurisdiction-type").value,can_receive_actions:document.querySelector("#jurisdiction-can-receive").checked,is_active:true});jurisdictionDialog.close();showToast("Project jurisdiction saved.");await renderAdministration();}catch(err){error.textContent=err.message;}finally{setButtonLoading(button,false);}});
  document.querySelectorAll(".remove-jurisdiction-button").forEach((button)=>button.addEventListener("click",async()=>{setButtonLoading(button,true,"Removing...");try{await deactivateProjectJurisdiction(button.dataset.id);showToast("Jurisdiction removed.");await renderAdministration();}catch(error){showToast(error.message,"error");}finally{setButtonLoading(button,false);}}));
}


function correspondenceStatusLabel(status) {
  return ({ open: "Open", under_review: "Under Review", replied: "Replied", closed: "Closed", no_action: "No Action" })[status] || status || "Open";
}

function correspondenceList(records, projectMap = true) {
  if (!records.length) return `<div class="empty-state">${icon("mail",42)}<h3>No correspondence recorded</h3><p>Add the first incoming or outgoing letter.</p></div>`;
  return `<div class="correspondence-list">${records.map((item) => {
    const project = state.projects.find((p) => p.id === item.project_id);
    const partyText = item.direction === "incoming"
      ? `From: ${escapeHtml(item.from_party || "—")} · To: ${escapeHtml(item.to_party || "—")}`
      : `To: ${escapeHtml(item.to_party || "—")} · From: ${escapeHtml(item.from_party || "—")}`;
    return `<article class="correspondence-item" data-correspondence-id="${item.id}">
      <div class="correspondence-main">
        <div class="correspondence-topline">
          <span class="direction-pill ${item.direction}">${item.direction}</span>
          <span class="priority-pill ${item.priority || "normal"}">${item.priority || "normal"}</span>
          <span class="letter-status ${item.status || "open"}">${correspondenceStatusLabel(item.status)}</span>
          ${projectMap && project ? `<span class="status-pill approved">${escapeHtml(project.project_code || project.project_name)}</span>` : ""}
        </div>
        <h3>${escapeHtml(item.subject || "Untitled correspondence")}</h3>
        <div class="correspondence-meta">
          <span>Letter No.: ${escapeHtml(item.letter_number || "—")}</span>
          <span>Letter Date: ${formatDate(item.letter_date)}</span>
          <span>${item.direction === "incoming" ? "Received" : "Sent"}: ${formatDate(item.received_or_sent_date)}</span>
          ${item.due_date ? `<span>Due: ${formatDate(item.due_date)}</span>` : ""}
        </div>
        <p class="correspondence-parties">${partyText}</p>
        ${item.reference_details ? `<p class="correspondence-parties"><strong>Reference:</strong> ${escapeHtml(item.reference_details)}</p>` : ""}
        ${item.action_required ? `<p class="correspondence-parties"><strong>Action:</strong> ${escapeHtml(item.action_required)}</p>` : ""}
      </div>
      <div class="correspondence-side">
        <strong>${item.attachment_name ? escapeHtml(item.attachment_name) : "No attachment"}</strong>
        ${item.attachment_size_bytes ? `<span>${formatFileSize(item.attachment_size_bytes)} · ${escapeHtml(item.attachment_mime_type || "file")}</span>` : ""}
        <span>Updated ${formatDate(item.updated_at || item.created_at)}</span>
        <div class="attachment-actions">
          ${item.attachment_path ? `<button class="btn secondary open-attachment-button" data-id="${item.id}">Open attachment</button>` : ""}
          ${["admin","editor"].includes(state.profile?.role) ? `<button class="btn secondary edit-correspondence-button" data-id="${item.id}">Update status</button>` : ""}
        </div>
      </div>
    </article>`;
  }).join("")}</div>`;
}


function correspondenceOfficeOptions(selected = "") {
  const active = state.directoryEntities.filter((entity) => entity.is_active !== false);
  const frequent = active
    .filter((entity) => entity.is_frequent)
    .sort((a, b) => Number(a.display_order || 999) - Number(b.display_order || 999) || a.name.localeCompare(b.name));
  const others = active
    .filter((entity) => !entity.is_frequent)
    .sort((a, b) => a.name.localeCompare(b.name));

  const option = (entity) => `<option value="${escapeHtml(entity.name)}" ${selected === entity.name ? "selected" : ""}>${escapeHtml(entity.name)}</option>`;
  return `<option value="">Select office/organisation</option>
    ${frequent.length ? `<optgroup label="Frequently used">${frequent.map(option).join("")}</optgroup>` : ""}
    ${others.length ? `<optgroup label="Directory (A–Z)">${others.map(option).join("")}</optgroup>` : ""}
    <option value="__other__" ${selected === "__other__" ? "selected" : ""}>Other</option>`;
}

function bindOtherOfficeFields() {
  [["#corr-from-select", "#corr-from-other"], ["#corr-to-select", "#corr-to-other"]].forEach(([selectId, otherId]) => {
    const select = document.querySelector(selectId);
    const other = document.querySelector(otherId);
    if (!select || !other) return;
    const sync = () => {
      const isOther = select.value === "__other__";
      other.hidden = !isOther;
      const input = other.querySelector("input");
      if (input) {
        input.required = isOther;
        if (!isOther) input.value = "";
      }
    };
    select.addEventListener("change", sync);
    sync();
  });
}

function selectedOfficeValue(selectId, otherInputId) {
  const select = document.querySelector(selectId);
  if (!select) return null;
  if (select.value === "__other__") {
    return document.querySelector(otherInputId)?.value?.trim() || null;
  }
  return select.value || null;
}

function projectCorrespondenceModule(project) {
  const records = state.correspondence.filter((item) => item.project_id === project.id);
  return `<div><div class="module-header"><div><h2>Correspondence</h2><p>Incoming and outgoing letters linked to this project.</p></div>${["admin","editor"].includes(state.profile?.role) ? `<button class="btn primary" id="add-project-correspondence">${icon("plus")}Add letter</button>` : ""}</div>${correspondenceList(records, false)}${correspondenceDialog(project.id)}</div>`;
}

function globalCorrespondenceTemplate() {
  const canEdit = ["admin","editor"].includes(state.profile?.role);
  return `<div class="app-shell">${appHeader()}${sidebar("correspondence")}
    <main class="main-content correspondence-page">
      <div class="breadcrumb"><span>Dashboard</span><b>/</b>Correspondence</div>

async function renderGlobalCorrespondence() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading correspondence...</p></div>`;
  try {
    state.correspondence = await getCorrespondence();
    root.innerHTML = globalCorrespondenceTemplate();
    bindGlobalCorrespondenceEvents();
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p></div>`;
  }
}

function bindCorrespondenceDialogEvents(onSaved) {
  bindOtherOfficeFields();
  const fileInput = document.querySelector("#corr-attachment-file");
  fileInput?.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    try {
      validateCorrespondenceAttachment(file);
      fileInput.setCustomValidity("");
    } catch (error) {
      fileInput.value = "";
      fileInput.setCustomValidity(error.message);
      fileInput.reportValidity();
    }
  });
  const form = document.querySelector("#correspondence-form");
  form?.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#save-correspondence-button");

function bindDashboardActivation(element,activate){

  if(!element.getAttribute("aria-label")) element.setAttribute("aria-label",`Open ${element.textContent.trim().replace(/\s+/g," ")}`);

  });

function dashboardNavigationFallback(parentRoute){
  if(parentRoute&&location.hash!==parentRoute){
    location.hash=parentRoute;
  }
  showToast("The selected record is no longer available. Opened the parent register.","info");
}

function openExactDashboardCalendarRecord(recordId,parentRoute){
  if(!recordId){
    dashboardNavigationFallback(parentRoute);
    return;
  }
  let attempts=0;
  const tryOpen=()=>{
    attempts+=1;
    try{
      const item=calendarItems().find((entry)=>entry.kind==="manual"&&String(entry.sourceId)===String(recordId));
      if(item){
        const dialog=document.querySelector("#calendar-event-dialog");
        if(item.editable&&dialog){
          openCalendarItem(item,dialog);
          return;
        }
        const chip=[...document.querySelectorAll("[data-calendar-item]")].find((element)=>element.dataset.calendarItem===item.id);
        if(chip){
          chip.scrollIntoView({behavior:"smooth",block:"center"});
          chip.classList.add("calendar-target-highlight");
          setTimeout(()=>chip.classList.remove("calendar-target-highlight"),3500);
          return;
        }
      }
    }catch(error){}
    if(attempts<12){
      setTimeout(tryOpen,180);
      return;
    }
    dashboardNavigationFallback(parentRoute);
  };
  setTimeout(tryOpen,120);
}

function navigateToDashboardRecord(recordType,recordId,parentRoute){
  if(recordType==="Action"){
    openActionDetails(recordId);
    return;
  }
  if(recordType==="Calendar"){
    const event=state.calendarEvents.find((item)=>String(item.id)===String(recordId));
    if(event?.event_date) state.calendarViewDate=new Date(`${event.event_date}T00:00:00`);
  }
  const routeUnchanged=location.hash===parentRoute;
  location.hash=parentRoute;
  if(routeUnchanged) route();
  if(recordType==="Calendar"){
    openExactDashboardCalendarRecord(recordId,parentRoute);
    return;
  }
  openExactSearchRecord(recordType,recordId,{fallbackRoute:parentRoute,notifyOnFailure:true});
}

function reportData(){

  const inspections=range(pid?state.inspections.filter(i=>i.project_id===pid):state.inspections,"inspection_date");
  const today=new Date();today.setHours(0,0,0,0);
  const openActions=actions.filter(i=>!["completed","cancelled"].includes(i.status));
  const overdueActions=openActions.filter(i=>i.due_date&&new Date(`${i.due_date}T00:00:00`)<today);
  const pendingVerification=state.actionProgressUpdates.filter(u=>u.verification_status==="pending"&&actions.some(a=>a.id===u.action_id));

  return{projects,correspondence,actions,inspections,openActions,overdueActions,pendingVerification,openInspections,criticalInspections};
}

function isoDateLocal(date) {
  const copy = new Date(date);
  const year = copy.getFullYear();
  const month = String(copy.getMonth() + 1).padStart(2, "0");
  const day = String(copy.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function calendarItems() {
  const items = [];

  state.calendarEvents
    .filter((event) => event.status !== "cancelled")
    .forEach((event) => items.push({
      id: `manual:${event.id}`,
      sourceId: event.id,
      kind: "manual",
      date: event.event_date,
      title: event.title,
      detail: `${event.event_type}${event.location ? ` · ${event.location}` : ""}`,
      projectId: event.project_id,
      editable: ["admin", "editor"].includes(state.profile?.role),
    }));

  state.actionItems
    .filter((action) => !["completed", "cancelled"].includes(action.status))
    .forEach((action) => {
      const project = state.projects.find((item) => item.id === action.project_id);
      const projectLabel = project?.project_code || project?.project_name || "Project";
      if (action.due_date) items.push({
        id: `due:${action.id}`,
        kind: "action_due",
        date: action.due_date,
        title: `Due: ${action.title}`,
        detail: projectLabel,
        actionId: action.id,
        projectId: action.project_id,
      });
      if (action.reminder_date) items.push({
        id: `reminder:${action.id}`,
        kind: "reminder",
        date: action.reminder_date,
        title: `Reminder: ${action.title}`,
        detail: projectLabel,
        actionId: action.id,
        projectId: action.project_id,
      });
    });

  state.projects.forEach((project) => {
    const milestones = [
      ["sanction_date", "Sanction date"],
      ["appointed_date", "Appointed date"],
      ["scheduled_completion_date", "Scheduled completion"],
      ["actual_completion_date", "Actual completion"],
    ];
    milestones.forEach(([field, label]) => {
      if (!project[field]) return;
      items.push({
        id: `milestone:${project.id}:${field}`,
        kind: "milestone",
        date: project[field],
        title: `${label}: ${project.project_name}`,
        detail: project.project_code || "Project milestone",
        projectId: project.id,
      });
    });
  });

  return items.sort((a, b) => String(a.date).localeCompare(String(b.date)) || a.title.localeCompare(b.title));
}

function monthLabel(date) {
  return new Intl.DateTimeFormat("en-IN", { month: "long", year: "numeric" }).format(date);
}

function calendarMonthCells(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const first = new Date(year, month, 1);
  const gridStart = new Date(year, month, 1 - first.getDay());
  return Array.from({ length: 42 }, (_, index) => {
    const date = new Date(gridStart);
    date.setDate(gridStart.getDate() + index);
    return date;
  });
}

function calendarGrid(items) {
  const view = state.calendarViewDate;
  const todayIso = isoDateLocal(new Date());
  const cells = calendarMonthCells(view);
  const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return `<div class="calendar-grid">
    ${weekdays.map((day) => `<div class="calendar-weekday">${day}</div>`).join("")}
    ${cells.map((date) => {
      const iso = isoDateLocal(date);
      const events = items.filter((item) => item.date === iso);
      const outside = date.getMonth() !== view.getMonth();
      return `<div class="calendar-day ${outside ? "outside" : ""} ${iso === todayIso ? "today" : ""}">
        <span class="calendar-date-number">${date.getDate()}</span>
        ${events.slice(0, 4).map((item) => `<button class="calendar-event-chip ${item.kind}" data-calendar-item="${escapeHtml(item.id)}" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</button>`).join("")}
        ${events.length > 4 ? `<span class="field-help">+${events.length - 4} more</span>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}

function calendarAgenda(items) {
  const view = state.calendarViewDate;
  const month = view.getMonth();
  const year = view.getFullYear();
  const monthItems = items.filter((item) => {
    const date = new Date(`${item.date}T00:00:00`);
    return date.getMonth() === month && date.getFullYear() === year;
  });
  if (!monthItems.length) return `<div class="empty-state">${icon("calendar",42)}<h3>No events this month</h3><p>Add a meeting, inspection, hearing or review.</p></div>`;
  return `<div class="calendar-agenda">${monthItems.map((item) => {
    const project = state.projects.find((project) => project.id === item.projectId);
    return `<article class="calendar-agenda-item" data-calendar-item-id="${escapeHtml(item.id)}">
      <div><strong>${formatDate(item.date)}</strong><span>${escapeHtml(item.kind.replace("_", " "))}</span></div>

    </article>`;
  }).join("")}</div>`;
}

function openExactCalendarAction(actionId){
  openActionDetails(actionId);
}

function openCalendarItem(item,dialog){
  if(!item)return;
  if(item.kind==="manual"&&item.editable){
    const event=state.calendarEvents.find(entry=>entry.id===item.sourceId);
    populateCalendarForm(event);
    dialog.showModal();
    return;
  }
  if(item.actionId){
    openExactCalendarAction(item.actionId);
    return;
  }
  if(item.projectId){
    location.hash=`#project/${item.projectId}`;
    route();
  }
}

function bindCalendarEvents() {
  bindCommonEvents();
  document.querySelector("#calendar-prev")?.addEventListener("click", () => {
    state.calendarViewDate = new Date(state.calendarViewDate.getFullYear(), state.calendarViewDate.getMonth() - 1, 1);
    root.innerHTML = calendarTemplate(); bindCalendarEvents();
  });
  document.querySelector("#calendar-next")?.addEventListener("click", () => {
    state.calendarViewDate = new Date(state.calendarViewDate.getFullYear(), state.calendarViewDate.getMonth() + 1, 1);
    root.innerHTML = calendarTemplate(); bindCalendarEvents();
  });
  document.querySelector("#calendar-today")?.addEventListener("click", () => {
    state.calendarViewDate = new Date(); root.innerHTML = calendarTemplate(); bindCalendarEvents();
  });

  const dialog = document.querySelector("#calendar-event-dialog");
  document.querySelector("#add-calendar-event")?.addEventListener("click", () => { populateCalendarForm(); dialog.showModal(); });
  document.querySelectorAll(".edit-calendar-event").forEach((button) => button.addEventListener("click", () => {
    const event = state.calendarEvents.find((item) => item.id === button.dataset.eventId);
    if (!event) return;
    populateCalendarForm(event); dialog.showModal();
  }));
  document.querySelectorAll(".open-calendar-action").forEach((button) => button.addEventListener("click", () => {
    openExactCalendarAction(button.dataset.actionId);
  }));
  document.querySelectorAll(".open-calendar-project").forEach((button) => button.addEventListener("click", () => {
    location.hash=`#project/${button.dataset.projectId}`;
    route();
  }));
  document.querySelectorAll(".calendar-event-chip").forEach((button) => button.addEventListener("click", () => {
    const item = calendarItems().find((entry) => entry.id === button.dataset.calendarItem);
    openCalendarItem(item,dialog);
  }));

  document.querySelector("#calendar-event-form")?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.querySelector("#calendar-event-id").value;
    const payload = {
      title: document.querySelector("#calendar-title").value.trim(),
      project_id: document.querySelector("#calendar-project").value || null,
      event_type: document.querySelector("#calendar-type").value,
      event_date: document.querySelector("#calendar-date").value,
      start_time: document.querySelector("#calendar-start-time").value || null,
      end_time: document.querySelector("#calendar-end-time").value || null,
      location: document.querySelector("#calendar-location").value.trim() || null,
      status: document.querySelector("#calendar-status").value,
      description: document.querySelector("#calendar-description").value.trim() || null,
    };
    const button = document.querySelector("#calendar-save-button");
    const error = document.querySelector("#calendar-error");
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      if (id) await updateCalendarEvent(id, payload); else await createCalendarEvent(payload);
      dialog.close(); showToast(id ? "Calendar event updated." : "Calendar event added."); await renderCalendar();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
}

function notificationStateFor(key) {
  return state.notificationStates.find((item) => item.notification_key === key) || null;
}

function buildNotifications() {
  const results = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const currentUserId = state.profile?.id;

  state.actionItems.forEach((action) => {
    if (["completed", "cancelled"].includes(action.status)) return;
    const project = state.projects.find((item) => item.id === action.project_id);
    const projectLabel = project?.project_code || project?.project_name || "Project";
    const assignees = actionAssigneesFor(action.id);
    const assignedToMe = assignees.some((item) => item.user_id === currentUserId);

    if (assignedToMe) {
      results.push({
        key: `assigned:${action.id}:${currentUserId}`,
        type: "assigned",
        title: `Action assigned: ${action.title}`,
        message: `${projectLabel}${action.due_date ? ` · Due ${formatDate(action.due_date)}` : ""}`,
        actionId: action.id,
        projectId: action.project_id,
        sortDate: action.updated_at || action.created_at,
      });
    }

    if (action.due_date && (assignedToMe || canVerifyAction(action) || canControlAction(action))) {
      const due = new Date(`${action.due_date}T00:00:00`);
      const days = Math.round((due - today) / 86400000);
      if (days < 0) {
        results.push({
          key: `overdue:${action.id}:${action.due_date}`,
          type: "overdue",
          title: `Overdue action: ${action.title}`,
          message: `${projectLabel} · Due date was ${formatDate(action.due_date)}`,
          actionId: action.id,
          projectId: action.project_id,
          sortDate: action.due_date,
        });
      } else if (days <= 3) {
        results.push({
          key: `due-soon:${action.id}:${action.due_date}`,
          type: "due_soon",
          title: `Action due ${days === 0 ? "today" : `in ${days} day${days === 1 ? "" : "s"}`}: ${action.title}`,
          message: `${projectLabel} · Due ${formatDate(action.due_date)}`,
          actionId: action.id,
          projectId: action.project_id,
          sortDate: action.due_date,
        });
      }
    }
  });

  state.actionProgressUpdates
    .filter((update) => update.verification_status === "pending")
    .forEach((update) => {
      const action = state.actionItems.find((item) => item.id === update.action_id);
      if (!action || !canVerifyAction(action)) return;
      results.push({
        key: `verification:${update.id}`,
        type: "verification",
        title: `Progress verification pending: ${action.title}`,
        message: `${actionUserName(update.submitted_by)} claimed ${update.claimed_progress_percent}% progress.`,
        actionId: action.id,
        projectId: action.project_id,
        sortDate: update.submitted_at,
      });
    });

  return results
    .map((item) => ({ ...item, state: notificationStateFor(item.key) }))
    .filter((item) => !item.state?.dismissed_at)
    .sort((a, b) => String(b.sortDate || "").localeCompare(String(a.sortDate || "")));
}

function unreadNotificationCount() {
  return (state.notifications || []).filter((item) => !item.state?.read_at && !item.state?.dismissed_at).length;
}

function notificationTypeLabel(type) {
  return ({ assigned: "Assigned action", overdue: "Overdue", due_soon: "Due soon", verification: "Verification" })[type] || type;
}

function notificationIcon(type) {
  return type === "verification" ? "check" : type === "overdue" ? "bell" : type === "due_soon" ? "calendar" : "clipboard";
}

function notificationsTemplate() {
  const unread = unreadNotificationCount();
  return `<div class="app-shell">${appHeader()}${sidebar("")}
    <main class="main-content notification-page">
      <div class="breadcrumb"><span>Dashboard</span><b>/</b>Notifications</div>
      <div class="admin-heading"><div><h1>Notifications and Reminders</h1><p>Assigned actions, due dates, overdue items and progress awaiting verification.</p></div>${unread ? `<button class="btn secondary" id="mark-all-notifications-read">Mark all read</button>` : ""}</div>
      <section class="action-summary-grid">
        <div class="admin-metric"><span>Unread</span><strong>${unread}</strong></div>
        <div class="admin-metric"><span>Total active alerts</span><strong>${state.notifications.length}</strong></div>
        <div class="admin-metric"><span>Overdue alerts</span><strong>${state.notifications.filter((n)=>n.type==="overdue").length}</strong></div>
        <div class="admin-metric"><span>Verification alerts</span><strong>${state.notifications.filter((n)=>n.type==="verification").length}</strong></div>
      </section>
      <section class="admin-card"><div class="admin-card-heading"><div><h2>Notification centre</h2><p>Dismissed alerts remain hidden unless the underlying condition changes.</p></div></div>
        <div style="padding:18px 20px;">
          ${state.notifications.length ? `<div class="notification-list">${state.notifications.map((item) => `<article class="notification-item ${item.state?.read_at ? "" : "unread"}">
            <div class="notification-icon ${item.type}">${icon(notificationIcon(item.type))}</div>
            <div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.message)}</p><small>${escapeHtml(notificationTypeLabel(item.type))}</small></div>
            <div class="notification-actions">
              ${!item.state?.read_at ? `<button class="btn secondary notification-read-button" data-key="${escapeHtml(item.key)}">Mark read</button>` : ""}
              <button class="btn primary notification-open-button" data-action-id="${item.actionId}" data-project-id="${item.projectId}">Open exact action</button>
              <button class="btn secondary notification-dismiss-button" data-key="${escapeHtml(item.key)}">Dismiss</button>
            </div>
          </article>`).join("")}</div>` : `<div class="empty-state">${icon("bell",42)}<h3>No active notifications</h3><p>You are up to date.</p></div>`}

async function renderNotifications() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading notifications...</p></div>`;
  try {
    await loadActionData();
    state.notificationStates = await getNotificationStates();
    state.notifications = buildNotifications();
    root.innerHTML = notificationsTemplate();
    bindNotificationEvents();
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p></div>`;
  }
}

function bindNotificationEvents() {
  bindCommonEvents();
  document.querySelectorAll(".notification-read-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await saveNotificationState(button.dataset.key, { read_at: new Date().toISOString(), dismissed_at: null }); await renderNotifications(); }
    catch (error) { showToast(error.message, "error"); }
  }));
  document.querySelectorAll(".notification-dismiss-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await saveNotificationState(button.dataset.key, { read_at: new Date().toISOString(), dismissed_at: new Date().toISOString() }); await renderNotifications(); }
    catch (error) { showToast(error.message, "error"); }
  }));
  document.querySelectorAll(".notification-open-button").forEach((button) => button.addEventListener("click", async () => {
    const actionId = button.dataset.actionId;
    await saveNotificationState(
      state.notifications.find((item) => item.actionId === actionId)?.key || `opened:${actionId}`,
      { read_at: new Date().toISOString(), dismissed_at: null }
    ).catch(() => {});
    openActionDetails(actionId);
  }));
  document.querySelector("#mark-all-notifications-read")?.addEventListener("click", async (event) => {
    const button = event.currentTarget;
    setButtonLoading(button, true, "Saving...");
    try {
      for (const item of state.notifications.filter((n) => !n.state?.read_at)) {
        await saveNotificationState(item.key, { read_at: new Date().toISOString(), dismissed_at: null });
      }
      await renderNotifications();
    } catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  });
}

function actionStatusLabel(status) {
  return ({ open: "Open", in_progress: "In Progress", awaiting_response: "Awaiting Response", completed: "Completed", cancelled: "Cancelled" })[status] || status || "Open";
}

function actionUserName(userId) {
  const user = state.assignableUsers.find((item) => item.id === userId);
  return user?.full_name || "Unknown user";
}

function actionAssigneesFor(actionId) {
  return state.actionAssignees.filter((item) => item.action_id === actionId && item.is_active);
}

function actionUpdatesFor(actionId) {
  return state.actionProgressUpdates.filter((item) => item.action_id === actionId);
}

function jurisdictionUsersForProject(projectId) {
  const eligibleIds = new Set(state.projectJurisdictions
    .filter((item) => item.project_id === projectId && item.is_active && item.can_receive_actions)
    .map((item) => item.user_id));
  return state.assignableUsers.filter((user) => eligibleIds.has(user.id));
}

function actionTimingClass(item) {
  if (item.status === "completed") return "completed";
  if (!item.due_date) return "";
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(`${item.due_date}T00:00:00`);
  const days = Math.round((due - today) / 86400000);
  if (days < 0) return "overdue";
  if (days <= 3) return "due-soon";
  return "";
}

function canControlAction(item) {
  return state.profile?.role === "admin" || item.assigned_by === state.profile?.id || item.created_by === state.profile?.id;
}

function canSubmitProgress(item) {
  return actionAssigneesFor(item.id).some((assignment) => assignment.user_id === state.profile?.id);
}


const OFFICE_ACTION_TYPES = [
  ["execute_work","Execute work"],
  ["examine_report","Examine and report"],
  ["prepare_draft","Prepare draft reply"],
  ["financial_scrutiny","Financial scrutiny"],
  ["audit_scrutiny","Audit scrutiny"],
  ["submit_comments","Submit comments"],
  ["forward_subordinate","Forward to subordinate office"],
  ["submit_higher","Submit to higher office"],
  ["seek_clarification","Seek clarification"],
  ["compliance_report","Compliance report"],
  ["record_close","Record and close"],
];

const WORKFLOW_STAGES = [
  ["received","Received"],["under_examination","Under examination"],["draft_prepared","Draft prepared"],
  ["pending_approval","Pending approval"],["approved","Approved"],["forwarded","Forwarded"],
  ["awaiting_response","Awaiting subordinate response"],["response_received","Response received"],
  ["verified","Verified"],["closed","Closed"]
];

function officeActionTypeLabel(value){ return OFFICE_ACTION_TYPES.find(([key])=>key===value)?.[1] || value || "Execute work"; }
function workflowStageLabel(value){ return WORKFLOW_STAGES.find(([key])=>key===value)?.[1] || value || "Received"; }
function workflowEventsFor(actionId){ return state.actionWorkflowEvents.filter((event)=>event.action_id===actionId); }
function isPAUser(){ const d=(state.profile?.designation||"").toLowerCase(); return d.includes("personal assistant") || d.includes("(pa)"); }
function isInternalProcessor(){ const d=(state.profile?.designation||"").toLowerCase(); return d.includes("project officer") || d.includes("auditor") || d.includes("accountant") || isPAUser(); }
function canProcessOfficeAction(item){ return canControlAction(item) || canSubmitProgress(item) || isInternalProcessor(); }
function canForwardDownward(item){ return canControlAction(item) || (isPAUser() && item.approved_for_forwarding && item.movement_direction === "downward"); }
function canSubmitUpward(item){ return canControlAction(item) || state.profile?.id === item.competent_authority_id; }

function workflowHistory(item){
  const events=workflowEventsFor(item.id);
  if(!events.length) return "";
  return `<div class="workflow-history">${events.map((event)=>`<div class="workflow-event"><strong>${escapeHtml(actionUserName(event.performed_by))}</strong> · ${escapeHtml(event.event_type.replaceAll("_"," "))}${event.to_stage?` → ${escapeHtml(workflowStageLabel(event.to_stage))}`:""}${event.on_behalf_of?` · On behalf of ${escapeHtml(actionUserName(event.on_behalf_of))}`:""}${event.remarks?`<div>${escapeHtml(event.remarks)}</div>`:""}${event.draft_text?`<div><strong>Draft/Report:</strong> ${escapeHtml(event.draft_text)}</div>`:""}<small>${formatDate(event.created_at)}</small></div>`).join("")}</div>`;
}

function canVerifyAction(item) {
  return state.profile?.role === "admin" || item.verifier_id === state.profile?.id || item.assigned_by === state.profile?.id || item.created_by === state.profile?.id;
}

function progressHistory(item) {
  const updates = actionUpdatesFor(item.id);
  if (!updates.length) return "";
  return `<div class="progress-history">${updates.map((update) => `<div class="progress-update ${update.verification_status}">
    <h4>${escapeHtml(actionUserName(update.submitted_by))} claimed ${update.claimed_progress_percent}% · ${escapeHtml(update.verification_status)}</h4>
    <p><strong>Work done:</strong> ${escapeHtml(update.work_done)}</p>
    ${update.remaining_work ? `<p><strong>Remaining:</strong> ${escapeHtml(update.remaining_work)}</p>` : ""}
    ${update.delay_reason ? `<p><strong>Delay/reason:</strong> ${escapeHtml(update.delay_reason)}</p>` : ""}
    ${update.verification_remarks ? `<p><strong>Verification:</strong> ${escapeHtml(update.verification_remarks)}</p>` : ""}
    ${update.verification_status === "pending" && canVerifyAction(item) ? `<div class="progress-update-actions"><button class="btn secondary verify-progress-button" data-update-id="${update.id}" data-action-id="${item.id}">Review update</button></div>` : ""}
  </div>`).join("")}</div>`;
}

function pendingVerificationActionIds() {
  return new Set(state.actionProgressUpdates
    .filter((update) => update.verification_status === "pending")
    .map((update) => String(update.action_id)));
}

function actionIsOpen(item) {
  return !["completed", "cancelled"].includes(item.status);
}

function actionIsOverdue(item, today = null) {
  if (!item.due_date || !actionIsOpen(item)) return false;
  const currentDay = today || new Date();
  currentDay.setHours(0, 0, 0, 0);
  return new Date(`${item.due_date}T00:00:00`) < currentDay;
}

function actionMatchesDueDate(item, category) {
  if (category === "all") return true;
  if (!actionIsOpen(item)) return false;
  if (category === "no_due_date") return !item.due_date;
  if (!item.due_date) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(`${item.due_date}T00:00:00`);
  if (category === "overdue") return actionIsOverdue(item, today);
  if (category === "today") return due.getTime() === today.getTime();
  if (category === "next_7_days") {
    const end = new Date(today); end.setDate(end.getDate() + 7);
    return due > today && due <= end;
  }
  if (category === "more_than_7_days") {
    const end = new Date(today); end.setDate(end.getDate() + 7);
    return due > end;
  }
  return true;
}

function filteredActionItems() {
  const filters = state.actionFilters;
  const pendingIds = pendingVerificationActionIds();
  const query = filters.query.trim().toLowerCase();
  return state.actionItems.filter((item) => {
    if (filters.quickView === "open" && !actionIsOpen(item)) return false;
    if (filters.quickView === "overdue" && !actionIsOverdue(item)) return false;
    if (filters.quickView === "pending_verification" && !pendingIds.has(String(item.id))) return false;
    if (filters.quickView === "completed" && item.status !== "completed") return false;
    if (filters.project !== "all" && String(item.project_id) !== filters.project) return false;
    if (filters.status !== "all" && item.status !== filters.status) return false;
    if (filters.priority !== "all" && (item.priority || "normal") !== filters.priority) return false;
    if (filters.workflowStage !== "all" && (item.workflow_stage || "received") !== filters.workflowStage) return false;
    if (filters.assignee !== "all" && !actionAssigneesFor(item.id).some((assignment) => String(assignment.user_id) === filters.assignee)) return false;
    if (!actionMatchesDueDate(item, filters.dueDate)) return false;
    if (query) {
      const project = state.projects.find((record) => String(record.id) === String(item.project_id));
      const assigneeNames = actionAssigneesFor(item.id).map((assignment) => actionUserName(assignment.user_id));
      const searchable = [
        item.title, item.description, item.issuer_note, item.office_processing_note,
        item.priority, actionStatusLabel(item.status), workflowStageLabel(item.workflow_stage),
        project?.project_code, project?.project_name, ...assigneeNames,
      ].map((value) => String(value || "").toLowerCase());
      if (!searchable.some((value) => value.includes(query))) return false;
    }
    return true;
  });
}

function actionSummary(items) {
  const pendingIds = pendingVerificationActionIds();
  return {
    all: items.length,
    open: items.filter(actionIsOpen).length,
    overdue: items.filter((item) => actionIsOverdue(item)).length,
    pending: items.filter((item) => pendingIds.has(String(item.id))).length,
    completed: items.filter((item) => item.status === "completed").length,
  };
}

function bindActionDetailEvents(item) {
  bindActionEvents(() => renderActionDetail(item.id));
  document.querySelector("#action-detail-back")?.addEventListener("click", () => { location.hash = "#actions"; });
  document.querySelector(".action-detail-project")?.addEventListener("click", (event) => {
    location.hash = `#project/${event.currentTarget.dataset.projectId}`;
  });
}

async function renderActionDetail(actionId) {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading action details...</p></div>`;
  try {
    await loadActionData();
    const item = state.actionItems.find((record) => String(record.id) === String(actionId));
    if (!item) {
      root.innerHTML = actionDetailNotFoundTemplate();
      bindCommonEvents();
      document.querySelector("#action-not-found-back")?.addEventListener("click", () => { location.hash = "#actions"; });
      return;
    }
    root.innerHTML = actionDetailTemplate(item);
    bindActionDetailEvents(item);
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p><button class="btn primary" id="action-load-error-back" type="button">Return to Action Tracking</button></div>`;
    document.querySelector("#action-load-error-back")?.addEventListener("click", () => { location.hash = "#actions"; });
  }
}

async function loadActionData(projectId = null) {
  [state.actionItems, state.assignableUsers, state.correspondence, state.projectJurisdictions, state.actionAssignees, state.actionProgressUpdates, state.actionWorkflowEvents] = await Promise.all([
    getActionItems(projectId), getAssignableUsers(), getCorrespondence(projectId), getProjectJurisdictions(), getActionAssignees(), getActionProgressUpdates(), getActionWorkflowEvents()
  ]);
}

async function renderActionPage() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading actions...</p></div>`;
  try { await loadActionData(); root.innerHTML = actionPageTemplate(); bindActionEvents(renderActionPage); }
  catch (error) { root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p></div>`; }
}

function renderAssigneePicker(projectId, selected = []) {
  const picker = document.querySelector("#action-assignee-picker");
  if (!picker) return;
  const users = jurisdictionUsersForProject(projectId);
  picker.innerHTML = users.length ? users.map((user, index)=>{
    const existing = selected.find((item)=>item.user_id === user.id);
    return `<label class="assignee-option"><input type="checkbox" class="assignee-checkbox" value="${user.id}" ${existing?"checked":""}/><span><strong>${escapeHtml(user.full_name)} — ${escapeHtml(user.designation || "User")}</strong><span>${escapeHtml(user.office_name || "Office not specified")}</span><select class="assignee-role" data-user-id="${user.id}" ${existing?"":"disabled"}><option value="lead" ${existing?.responsibility_type === "lead"?"selected":""}>Lead</option><option value="supporting" ${existing?.responsibility_type !== "lead"?"selected":""}>Supporting</option></select><input class="assignee-note" data-user-id="${user.id}" placeholder="Individual responsibility" value="${escapeHtml(existing?.responsibility_note || "")}" ${existing?"":"disabled"}/></span></label>`;
  }).join("") : `<p class="form-error">No approved officer currently has jurisdiction for this project. Add project jurisdiction in Administration first.</p>`;
  picker.querySelectorAll(".assignee-checkbox").forEach((box)=>box.addEventListener("change",()=>{
    picker.querySelector(`.assignee-role[data-user-id="${box.value}"]`).disabled = !box.checked;
    picker.querySelector(`.assignee-note[data-user-id="${box.value}"]`).disabled = !box.checked;
  }));
}

function suggestedWorkflowStage(eventType) {
  return ({
    examination_started: "under_examination",
    report_submitted: "pending_approval",
    draft_prepared: "draft_prepared",

function syncActionFilterControls() {

    "#action-filter-search": filters.query,

  });
  document.querySelectorAll("[data-action-quick-view]").forEach((button) => {

function projectDocumentsModule(project){
  const correspondenceDocs=state.correspondence
    .filter(item=>item.project_id===project.id&&item.attachment_path)
    .map(item=>({
      kind:"Correspondence attachment",
      title:item.attachment_name||item.subject||"Attachment",
      detail:`${item.letter_number||"No letter number"} · ${item.subject||"Correspondence"}`,
      date:item.letter_date||item.created_at,
      source:"correspondence",
      id:item.id,
      size:item.attachment_size_bytes,
      mime:item.attachment_mime_type
    }));
  const inspectionDocs=state.inspectionPhotos
    .filter(photo=>state.inspections.some(i=>i.id===photo.inspection_id&&i.project_id===project.id))
