<html lang="en">

<meta name="theme-color" content="#174a7e" />
<meta name="description" content="MARGDARSHI — National Highway administration and project reporting system." />
<title>MARGDARSHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --primary: #174a7e;
  --primary-dark: #0f3a66;
  --teal: #197a8c;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #64748b;
  --border: #dce3ea;
  --green: #16855b;
  --amber: #c66a05;
  --red: #d13c3c;
  --blue: #1f65b5;
  --shadow: 0 8px 24px rgba(23, 74, 126, .08);
  font-family: Inter, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .72; }
.icon { flex: 0 0 auto; }

.loading-screen { min-height: 100vh; display: grid; place-content: center; gap: 14px; text-align: center; color: var(--muted); }
.spinner { width: 17px; height: 17px; display: inline-block; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 999px; animation: spin .75s linear infinite; }
.spinner.dark { width: 28px; height: 28px; margin: auto; border-color: #d7e1eb; border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

.auth-page { min-height: 100vh; display: grid; grid-template-columns: minmax(460px, 1.15fr) minmax(420px, .85fr); }
.auth-brand-panel { position: relative; overflow: hidden; padding: 38px 52px; display: flex; flex-direction: column; color: #fff; background: linear-gradient(145deg, #0e3d6f, #176b91); }
.auth-brand-panel::before, .auth-brand-panel::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); }
.auth-brand-panel::before { width: 560px; height: 560px; right: -230px; top: -210px; }
.auth-brand-panel::after { width: 360px; height: 360px; left: -150px; bottom: -180px; }
.brand-lockup { display: flex; align-items: center; gap: 12px; min-width: 240px; }
.brand-lockup .emblem { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,.38); border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
.brand-lockup strong { display: block; font-size: 21px; letter-spacing: .025em; }
.brand-lockup span { display: block; font-size: 12px; opacity: .88; margin-top: 3px; }
.auth-intro { z-index: 1; max-width: 650px; margin: auto 0; }
.eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.auth-intro .eyebrow { color: #9ee0eb; }
.auth-intro h1 { font-size: clamp(34px, 4vw, 56px); line-height: 1.08; letter-spacing: -.04em; margin: 0 0 22px; }
.auth-intro > p:not(.eyebrow) { max-width: 600px; color: rgba(255,255,255,.82); font-size: 17px; line-height: 1.7; }
.auth-feature-grid { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 12px; margin-top: 30px; max-width: 520px; }
.auth-feature-grid div { display: flex; align-items: center; gap: 10px; padding: 13px 15px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 13px; font-weight: 600; }
.auth-department { z-index: 1; font-size: 12px; opacity: .74; }
.auth-form-panel { padding: 36px; display: grid; place-items: center; background: linear-gradient(180deg, #fbfcfe, #f3f6f9); }
.auth-card { width: min(100%, 440px); padding: 36px; border: 1px solid var(--border); background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.auth-card-heading h2 { margin: 0; font-size: 29px; letter-spacing: -.02em; }
.auth-card-heading > p:last-child { margin: 8px 0 26px; color: var(--muted); font-size: 14px; }
.mobile-brand { display: none; }
label { display: grid; gap: 7px; color: #334155; font-size: 13px; font-weight: 600; }
input, select, textarea { width: 100%; border: 1px solid #cfd9e3; border-radius: 8px; padding: 11px 12px; color: var(--text); background: #fff; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23,74,126,.10); }
#login-form { display: grid; gap: 18px; }
.btn { min-height: 42px; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 5px 14px rgba(23,74,126,.18); }
.btn.primary:hover { background: var(--primary-dark); }
.btn.secondary { color: var(--primary); border-color: #cbd8e4; background: #fff; }
.btn.full { width: 100%; }
.auth-divider { display: flex; align-items: center; gap: 10px; margin: 24px 0 15px; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: #e4e9ef; }
.preview-link { display: block; margin: 14px auto 0; border: 0; background: transparent; color: var(--teal); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.auth-security { margin: 20px 0 0; text-align: center; color: #94a3b8; font-size: 11px; line-height: 1.5; }
.form-error { min-height: 16px; margin: 0; color: var(--red); font-size: 12px; font-weight: 500; }

.password-field { position: relative; }
.password-field input { padding-right: 72px; }
.password-toggle { position: absolute; right: 8px; bottom: 6px; min-height: 30px; border: 0; border-radius: 6px; padding: 4px 8px; background: transparent; color: var(--primary); font-size: 12px; font-weight: 700; }
.password-toggle:hover { background: #edf3f9; }
.field-help { display: block; margin-top: -6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.otp-label { display: grid; gap: 8px; color: #334155; font-size: 13px; font-weight: 600; }
.otp-boxes { display: grid; grid-template-columns: repeat(8, minmax(34px, 1fr)); gap: 7px; }
.otp-box {
  min-width: 0;
  height: 48px;
  padding: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.otp-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23,74,126,.10); }
@media (max-width: 520px) {
  .otp-boxes { gap: 4px; }
  .otp-box { height: 44px; font-size: 18px; }
}

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 245px 1fr; grid-template-rows: 96px 1fr; }
.topbar { position: sticky; top: 0; z-index: 20; grid-column: 1 / -1; display: grid; grid-template-columns: 275px minmax(260px, 740px) 1fr; align-items: center; gap: 28px; padding: 0 34px 0 24px; background: linear-gradient(90deg, #10447a, #07558e); color: #fff; box-shadow: 0 2px 7px rgba(15,58,102,.18); }
.global-search { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 10px; background: #fff; color: var(--muted); box-shadow: 0 5px 16px rgba(0,0,0,.13); }
.global-search input { border: 0; box-shadow: none; padding: 0; background: transparent; }
.global-search kbd { padding: 4px 7px; border: 1px solid #dce3ea; border-radius: 5px; color: #64748b; background: #f6f8fa; white-space: nowrap; }
.topbar-actions { justify-self: end; display: flex; align-items: center; gap: 18px; }
.notification-button { position: relative; display: grid; place-items: center; border: 0; background: transparent; color: #fff; }
.notification-button span { position: absolute; top: -9px; right: -8px; min-width: 19px; height: 19px; display: grid; place-items: center; border: 2px solid #0b5188; border-radius: 999px; background: #ef4444; font-size: 10px; font-weight: 700; }
.notification-button .notification-zero { display: none; }
.notification-page { display: grid; gap: 22px; }
.notification-list { display: grid; gap: 11px; }
.notification-item { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: start; padding: 15px 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.notification-item.unread { border-left: 4px solid var(--primary); background: #fbfdff; }
.notification-item.dismissed { display: none; }
.notification-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; background: #edf3f9; color: var(--primary); }
.notification-icon.overdue { color: #b91c1c; background: #fee2e2; }
.notification-icon.due_soon { color: #9a3412; background: #ffedd5; }
.notification-icon.verification { color: #6d28d9; background: #ede9fe; }
.notification-icon.assigned { color: #166534; background: #dcfce7; }
.notification-item h3 { margin: 0; font-size: 14px; }
.notification-item p { margin: 5px 0 0; color: #475569; font-size: 12px; line-height: 1.5; }
.notification-item small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
.notification-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.notification-actions .btn { min-height: 34px; padding: 6px 10px; }
@media (max-width:720px){.notification-item{grid-template-columns:auto 1fr}.notification-actions{grid-column:1/-1;justify-content:flex-start}}

.user-menu { display: flex; align-items: center; gap: 10px; }
.avatar { width: 42px; height: 42px; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.65); border-radius: 50%; background: rgba(255,255,255,.16); font-weight: 700; }
.user-menu strong, .user-menu span { display: block; }
.user-menu strong { font-size: 13px; }.user-menu span { margin-top: 3px; color: rgba(255,255,255,.78); font-size: 11px; }
.icon-button { width: 38px; height: 38px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 8px; color: inherit; background: transparent; }
.icon-button:hover { background: rgba(255,255,255,.12); }
.sidebar { position: sticky; top: 96px; height: calc(100vh - 96px); display: flex; flex-direction: column; justify-content: space-between; padding: 24px 12px 14px; background: #fff; border-right: 1px solid var(--border); }
.sidebar nav { display: grid; gap: 7px; }
.nav-item { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border: 0; border-radius: 8px; color: #334155; background: transparent; text-align: left; font-size: 13px; }
.nav-item span { flex: 1; }.nav-item:hover { background: #f4f7fa; }.nav-item.active { position: relative; color: #0f4f93; background: #edf3f9; font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 0; bottom: 0; width: 3px; border-radius: 3px; background: #1664b3; }
.sidebar-footer { padding: 18px 14px; border: 1px solid var(--border); border-radius: 10px; background: #fbfcfd; }
.sidebar-footer .road-mark { width: 39px; height: 39px; margin-bottom: 12px; display: grid; place-items: center; border-radius: 9px; color: #fff; background: var(--teal); font-size: 11px; font-weight: 800; }
.sidebar-footer strong, .sidebar-footer span { display: block; }.sidebar-footer strong { font-size: 12px; }.sidebar-footer span { margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.5; }
.main-content { min-width: 0; padding: 30px 24px; }
.register-page { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 26px; }
.content-column { min-width: 0; }
.breadcrumb { display: flex; gap: 11px; align-items: center; color: var(--muted); font-size: 12px; }.breadcrumb span { color: #1760aa; }.breadcrumb b { color: #c2ccd6; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin: 20px 0 24px; }
h1, h2, h3, p { overflow-wrap: anywhere; }
.page-heading h1 { margin: 0; font-size: 35px; line-height: 1.1; letter-spacing: -.035em; }.page-heading p { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
.filter-card { display: grid; grid-template-columns: minmax(210px, 1.5fr) repeat(3, minmax(125px, .7fr)) auto; gap: 12px; align-items: stretch; margin-bottom: 14px; padding: 17px; border: 1px solid var(--border); border-radius: 11px; background: #fff; box-shadow: 0 4px 15px rgba(31,41,55,.035); }
.search-input { display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #d1dae4; border-radius: 8px; color: var(--muted); }.search-input input { border: 0; padding: 0; box-shadow: none; background: transparent; }
.select-field { position: relative; gap: 1px; padding: 6px 9px; border: 1px solid #d1dae4; border-radius: 8px; background: #fff; }
.select-field span { color: #475569; font-size: 10px; }.select-field select { border: 0; padding: 0; box-shadow: none; background: transparent; font-weight: 500; }
.btn.reset { color: var(--teal); border-color: #d1dae4; background: #fff; }
.table-card { overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: #fff; box-shadow: 0 5px 18px rgba(31,41,55,.045); }
.table-scroll { overflow-x: auto; }.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }.data-table th { height: 51px; padding: 0 15px; color: #334155; background: #fafbfc; border-bottom: 1px solid var(--border); text-align: left; font-weight: 600; white-space: nowrap; }.data-table td { height: 66px; padding: 9px 15px; border-bottom: 1px solid #e5eaf0; vertical-align: middle; }.data-table tbody tr { cursor: pointer; transition: background .15s; }.data-table tbody tr:hover, .data-table tbody tr:focus { outline: none; background: #f7faff; }.data-table td strong, .data-table td span { display: block; }.data-table td > strong { color: #273244; font-size: 12px; }.data-table td > span:not(.status-badge) { margin-top: 5px; color: var(--muted); font-size: 10px; }.data-table th:first-child, .data-table td:first-child { min-width: 230px; }.data-table th:nth-child(3), .data-table td:nth-child(3) { min-width: 130px; }
.progress-cell { min-width: 100px; }.progress-cell > strong { font-size: 11px !important; }.progress-track { width: 100%; height: 6px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: #dfe5eb; }.progress-track span { height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg, #145ca5, #197a8c); }
.status-badge { width: fit-content; min-height: 27px; display: inline-flex !important; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid; border-radius: 999px; font-size: 10px !important; font-weight: 600; white-space: nowrap; }.status-badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }.status-badge.healthy { color: #16855b; border-color: #bce3d2; background: #edf9f3; }.status-badge.attention { color: #ba6707; border-color: #f3d59c; background: #fff8e8; }.status-badge.delayed { color: #d13c3c; border-color: #f2bbbb; background: #fff0f0; }.status-badge.draft { color: #64748b; border-color: #d6dde5; background: #f5f7f9; }.status-badge.progress { color: #1760aa; border-color: #bfd5ea; background: #edf5fc; }.status-badge.large { padding: 7px 13px; font-size: 12px !important; }
.row-menu { color: #345270; }.row-menu:hover { background: #edf3f8; }
.table-footer { padding: 15px 18px; color: var(--muted); font-size: 11px; }
.empty-state { min-height: 300px; display: grid; place-content: center; justify-items: center; padding: 30px; color: var(--muted); text-align: center; }.empty-state h3 { margin: 15px 0 6px; color: var(--text); }.empty-state p { margin: 0; font-size: 13px; }
.insights-column { display: grid; align-content: start; gap: 14px; }.insight-card, .demo-banner { padding: 18px; border: 1px solid var(--border); border-radius: 11px; background: #fff; box-shadow: 0 5px 18px rgba(31,41,55,.045); }.insight-card h2 { margin: 0 0 13px; font-size: 14px; }.metric-row { display: flex; align-items: center; gap: 13px; padding: 12px 0; border-bottom: 1px solid #e8edf2; }.metric-row:last-child { border-bottom: 0; }.metric-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 9px; }.metric-icon.blue { color: #175999; background: #eaf2f9; }.metric-icon.teal { color: #197a8c; background: #e7f5f7; }.metric-icon.amber { color: #c66a05; background: #fff2e5; }.metric-icon.green { color: #388a28; background: #edf7ea; }.metric-row span, .metric-row strong { display: block; }.metric-row span { color: var(--muted); font-size: 11px; }.metric-row strong { margin-top: 4px; font-size: 20px; }.card-title-row { display: flex; justify-content: space-between; }.card-title-row button, .text-button { border: 0; color: #1760aa; background: transparent; font-size: 11px; }.action-row { min-height: 42px; display: grid; grid-template-columns: 1fr auto auto; gap: 9px; align-items: center; border-bottom: 1px solid #edf0f3; font-size: 11px; }.action-row:last-child { border: 0; }.action-row > span { display: flex; gap: 8px; align-items: center; }.action-row b { min-width: 25px; height: 23px; display: grid; place-items: center; border-radius: 999px; background: #f1f4f7; font-size: 10px; }.dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; }.dot.amber { background: #d98900; }.dot.orange { background: #ed6b21; }.dot.blue { background: #1686bd; }.dot.red { background: #dc4b4b; }.dot.teal { background: #197a8c; }.demo-banner { border-color: #bcd9e1; background: #f1fafb; }.demo-banner strong { color: var(--teal); }.demo-banner p { color: var(--muted); font-size: 11px; line-height: 1.5; }.demo-banner a { color: var(--primary); font-size: 11px; font-weight: 600; }

.modal { width: min(92vw, 780px); max-height: 92vh; padding: 0; border: 0; border-radius: 14px; background: transparent; box-shadow: 0 25px 70px rgba(15,23,42,.28); }.modal::backdrop { background: rgba(15,35,55,.52); backdrop-filter: blur(2px); }.compact-modal { width: min(92vw, 480px); }.modal-card { max-height: 92vh; overflow-y: auto; padding: 27px; border-radius: 14px; background: #fff; }.modal-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }.modal-heading h2 { margin: 0; font-size: 24px; }.modal-heading p:last-child { margin: 7px 0 0; color: var(--muted); font-size: 12px; }.modal-heading .icon-button { color: #64748b; }.modal-heading .icon-button:hover { background: #f1f5f8; }.form-section { padding: 20px 0; border-top: 1px solid #e5eaf0; }.form-section h3 { margin: 0 0 16px; font-size: 14px; }.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }.form-grid.single { grid-template-columns: 1fr; }.form-grid .wide { grid-column: 1 / -1; }.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

const SESSION_KEY = "margdarshi.session";

function authHeaders(accessToken) {
  return {
    apikey: CONFIG.supabasePublishableKey,
    Authorization: `Bearer ${accessToken}`,
    "Content-Type": "application/json",
  };
}

async function parseResponse(response) {
  const contentType = response.headers.get("content-type") || "";
  const payload = contentType.includes("application/json") ? await response.json() : await response.text();
  if (!response.ok) {
    const message = payload?.msg || payload?.message || payload?.error_description || payload?.error || "Request failed";
    throw new Error(message);
  }
  return payload;
}

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function setSession(session) {
  if (!session) localStorage.removeItem(SESSION_KEY);
  else localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

async function signIn(email, password) {
  const response = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ email, password }),
  });
  const session = await parseResponse(response);
  setSession(session);
  return session;
}

async function signUp({ email, password, fullName, designation }) {

  });

}

async function refreshSession(session) {
  if (!session?.refresh_token) return null;
  const response = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ refresh_token: session.refresh_token }),
  });
  const refreshed = await parseResponse(response);
  setSession(refreshed);
  return refreshed;
}

async function ensureSession() {
  let session = getSession();
  if (!session) return null;
  const expiresAtMs = (session.expires_at || 0) * 1000;
  if (expiresAtMs && expiresAtMs - Date.now() < 60_000) {
    try {
      session = await refreshSession(session);
    } catch {
      setSession(null);
      return null;
    }
  }
  return session;
}

async function signOut() {
  const session = getSession();
  if (session?.access_token) {
    await fetch(`${CONFIG.supabaseUrl}/auth/v1/logout`, {
      method: "POST",
      headers: authHeaders(session.access_token),
    }).catch(() => null);
  }
  setSession(null);
}

async function rest(path, options = {}) {
  const session = await ensureSession();
  if (!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const response = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${path}`, {
    ...options,
    headers: {
      ...authHeaders(session.access_token),
      ...(options.headers || {}),
    },
  });
  return parseResponse(response);
}

const CORRESPONDENCE_BUCKET = "correspondence-attachments";
const MAX_ATTACHMENT_BYTES = 10 * 1024 * 1024;
const ALLOWED_ATTACHMENT_TYPES = new Set(["application/pdf", "image/jpeg", "image/png", "image/webp"]);

function safeStorageFilename(filename) {
  const dot = filename.lastIndexOf(".");
  const base = (dot > 0 ? filename.slice(0, dot) : filename)
    .normalize("NFKD")
    .replace(/[^\w.-]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    .slice(0, 80) || "attachment";
  const ext = dot > 0 ? filename.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, "") : "";
  return `${base}${ext}`;
}

function validateCorrespondenceAttachment(file) {
  if (!file) return;
  if (!ALLOWED_ATTACHMENT_TYPES.has(file.type)) {
    throw new Error("Only PDF, JPG, PNG and WEBP files are allowed.");
  }
  if (file.size > MAX_ATTACHMENT_BYTES) {
    throw new Error("Attachment must not exceed 10 MB.");
  }
}

async function uploadCorrespondenceAttachment(file, projectId, correspondenceId) {
  validateCorrespondenceAttachment(file);
  const session = await ensureSession();
  if (!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const filename = safeStorageFilename(file.name);
  const path = `${projectId}/${correspondenceId}/${Date.now()}-${filename}`;
  const response = await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/${CORRESPONDENCE_BUCKET}/${encodeURI(path)}`, {
    method: "POST",
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      Authorization: `Bearer ${session.access_token}`,
      "Content-Type": file.type,
      "x-upsert": "false",
      "cache-control": "3600",
    },
    body: file,
  });
  if (!response.ok) {
    let message = "Attachment upload failed.";
    try {
      const result = await response.json();
      message = result.message || result.error || message;
    } catch {}
    throw new Error(message);
  }
  return {
    attachment_path: path,
    attachment_name: file.name,
    attachment_size_bytes: file.size,
    attachment_mime_type: file.type,
  };
}

async function openCorrespondenceAttachment(record) {
  if (!record?.attachment_path) return;
  const session = await ensureSession();
  if (!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const response = await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/authenticated/${CORRESPONDENCE_BUCKET}/${encodeURI(record.attachment_path)}`, {
    headers: {
      apikey: CONFIG.supabasePublishableKey,
      Authorization: `Bearer ${session.access_token}`,
    },
  });
  if (!response.ok) {
    let message = "Unable to open attachment.";
    try {
      const result = await response.json();
      message = result.message || result.error || message;
    } catch {}
    throw new Error(message);
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const opened = window.open(url, "_blank", "noopener,noreferrer");
  if (!opened) {
    const link = document.createElement("a");
    link.href = url;
    link.download = record.attachment_name || "attachment";
    link.click();
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function formatFileSize(bytes) {
  const value = Number(bytes || 0);
  if (!value) return "";
  if (value < 1024 * 1024) return `${(value / 1024).toFixed(0)} KB`;
  return `${(value / (1024 * 1024)).toFixed(1)} MB`;
}

function escapeHtml(value = "") {
  return String(value).replace(/[&<>'"]/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
  })[char]);
}

function formatDate(value) {
  if (!value) return "—";
  return new Intl.DateTimeFormat("en-IN", { day: "2-digit", month: "short", year: "numeric" }).format(new Date(value));
}

function formatMoneyCrore(value) {
  if (value === null || value === undefined || value === "") return "—";
  return `₹${new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(Number(value))} crore`;
}

function healthClass(label) {
  const normalized = (label || "").toLowerCase();
  if (normalized.includes("healthy") || normalized.includes("completed")) return "healthy";
  if (normalized.includes("delay") || normalized.includes("critical")) return "delayed";
  if (normalized.includes("attention") || normalized.includes("pending")) return "attention";
  if (normalized.includes("draft") || normalized.includes("not started")) return "draft";
  return "progress";
}

function showToast(message, type = "success") {
  document.querySelector(".toast")?.remove();
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("visible"));
  setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => toast.remove(), 250);
  }, 3200);
}

function setButtonLoading(button, loading, label = "Please wait...") {
  if (!button) return;
  if (loading) {
    button.dataset.original = button.innerHTML;
    button.disabled = true;
    button.innerHTML = `<span class="spinner"></span>${label}`;
  } else {
    button.disabled = false;
    button.innerHTML = button.dataset.original || button.innerHTML;
  }
}

function sidebar(active = "projects") {

    ["mail", "correspondence", "Correspondence"],

    <nav>${items.map(([ic, key, label]) => `<button class="nav-item ${active === key ? "active" : ""}" data-nav="${key}">${icon(ic)}<span>${label}</span>${key === "admin" ? icon("arrow", 16) : ""}</button>`).join("")}</nav>

function appHeader() {
  const name = escapeHtml(state.profile?.full_name || "MARGDARSHI User");
  const designation = escapeHtml(state.profile?.designation || "Authorised User");
  const initials = name.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
  return `<header class="topbar">
    <div class="brand-lockup"><div class="emblem">NH</div><div><strong>MARGDARSHI</strong><span>National Highway Division Dhule</span></div></div>
    <div class="global-search">${icon("search", 19)}<input aria-label="Global search" placeholder="Search projects, letters, cases..." /><kbd>Ctrl K</kbd></div>
    <div class="topbar-actions"><button class="notification-button" id="notification-button" aria-label="Notifications">${icon("bell")}<span class="${unreadNotificationCount() ? "" : "notification-zero"}">${unreadNotificationCount()}</span></button><div class="user-menu"><div class="avatar">${initials}</div><div><strong>${name}</strong><span>${designation}</span></div></div><button class="icon-button" id="logout-button" title="Sign out">${icon("logout")}</button></div>
  </header>`;
}

function projectMetrics(projects) {
  const construction = projects.filter((p) => p.status === "construction").length;
  const pending = projects.reduce((sum, p) => sum + Number(p.pending_actions_count || 0), 0);
  const completed = projects.filter((p) => ["completed", "closed", "maintenance"].includes(p.status)).length;
  return [
    ["folder", "Total Projects", projects.length, "blue"],
    ["construction", "Under Construction", construction, "teal"],
    ["clipboard", "Pending Actions", pending, "amber"],
    ["check", "Completed / Maintenance", completed, "green"],
  ];
}

function filteredProjects() {
  const { query, highway, status, office } = state.filters;
  return state.projects.filter((project) => {
    const searchText = `${project.project_name} ${project.project_code || ""} ${project.highway_number || ""}`.toLowerCase();
    return (!query || searchText.includes(query.toLowerCase()))
      && (highway === "all" || project.highway_number === highway)
      && (status === "all" || project.status === status)
      && (office === "all" || project.implementing_office_name === office);
  });
}

function progressBar(value) {
  const percentage = Math.min(100, Math.max(0, Number(value || 0)));
  return `<div class="progress-cell"><strong>${percentage.toFixed(0)}%</strong><div class="progress-track"><span style="width:${percentage}%"></span></div></div>`;
}

function projectRows(projects) {
  if (!projects.length) {
    return `<div class="empty-state">${icon("projects", 42)}<h3>No matching projects</h3><p>Adjust the filters or add a new project.</p></div>`;
  }
  return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Project</th><th>Highway</th><th>Stage</th><th>Progress</th><th>Health</th><th>Updated</th><th></th></tr></thead><tbody>${projects.map((project) => `
    <tr data-project-id="${project.id}" tabindex="0">
      <td><strong>${escapeHtml(project.project_name)}</strong><span>${escapeHtml(project.project_code || project.description || "")}</span></td>
      <td>${escapeHtml(project.highway_number || "—")}</td>
      <td><strong>${escapeHtml(project.status_label || project.status)}</strong><span>${escapeHtml(project.mode || "")}</span></td>
      <td>${progressBar(project.physical_progress_pct)}</td>
      <td><span class="status-badge ${healthClass(project.health_label)}"><i></i>${escapeHtml(project.health_label || "In Progress")}</span></td>
      <td><strong>${formatDate(project.updated_at)}</strong><span>${escapeHtml(state.profile?.full_name || "MARGDARSHI")}</span></td>
      <td><button class="icon-button row-menu" aria-label="Project actions">${icon("menu")}</button></td>
    </tr>`).join("")}</tbody></table></div>`;
}

async function renderAdministration() {
  if (state.profile?.role !== "admin") {
    showToast("Administrator access is required.", "error");
    location.hash = "#projects";
    return;
  }
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading administration...</p></div>`;
  try {
    [state.adminUsers, state.assignments, state.directoryEntities, state.projectJurisdictions] = await Promise.all([getAdminUsers(), getUserAssignments(), getDirectoryEntities(true), getProjectJurisdictions()]);
    root.innerHTML = administrationTemplate();
    bindAdministrationEvents();
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p><button class="btn primary" id="back-admin-error">Back to projects</button></div>`;
    document.querySelector("#back-admin-error")?.addEventListener("click", () => location.hash = "#projects");
  }
}

function bindAdministrationEvents() {
  bindCommonEvents();
  document.querySelectorAll(".save-user-button").forEach((button) => button.addEventListener("click", async () => {
    const row = button.closest("tr");
    const userId = button.dataset.userId;
    const officeId = row.querySelector('[data-field="office_id"]').value || null;
    const officeName = state.offices.find((office) => office.id === officeId)?.name || null;
    const payload = {
      designation: row.querySelector('[data-field="designation"]').value || null,
      office_id: officeId,
      office_name: officeName,
      role: row.querySelector('[data-field="role"]').value,
      account_status: row.querySelector('[data-field="account_status"]').value,
      is_active: row.querySelector('[data-field="is_active"]').checked,
    };
    if (payload.account_status === "approved") {
      payload.approved_at = new Date().toISOString();
      payload.approved_by = state.session?.user?.id || null;
    }
    setButtonLoading(button, true, "Saving...");
    try {
      await updateAdminUser(userId, payload);
      showToast("User access updated.");
      await renderAdministration();
    } catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  }));

  const dialog = document.querySelector("#assignment-dialog");
  document.querySelectorAll(".add-charge-button").forEach((button) => button.addEventListener("click", () => {
    document.querySelector("#assignment-user-id").value = button.dataset.userId;
    document.querySelector("#assignment-user-label").textContent = `Assigning a post to ${button.dataset.userName}`;
    document.querySelector("#assignment-form").reset();
    document.querySelector("#assignment-user-id").value = button.dataset.userId;
    dialog.showModal();
  }));

  document.querySelector("#assignment-form")?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#assignment-save");
    const error = document.querySelector("#assignment-error");
    const type = document.querySelector("#assignment-type").value;
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      await createUserAssignment({
        user_id: document.querySelector("#assignment-user-id").value,
        designation: document.querySelector("#assignment-designation").value,
        office_id: document.querySelector("#assignment-office").value,
        assignment_type: type,
        is_primary: type === "substantive",
        effective_from: document.querySelector("#assignment-from").value || null,
        effective_to: document.querySelector("#assignment-to").value || null,
        order_reference: document.querySelector("#assignment-order").value.trim() || null,
        is_active: true,
      });
      dialog.close(); showToast("Post assignment saved."); await renderAdministration();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelectorAll(".assignment-toggle").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await setAssignmentActive(button.dataset.assignmentId, button.dataset.nextActive === "true"); showToast("Assignment updated."); await renderAdministration(); }
    catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  }));

  const directoryDialogElement = document.querySelector("#directory-dialog");
  const resetDirectoryForm = () => {
    document.querySelector("#directory-form")?.reset();
    document.querySelector("#directory-id").value = "";
    document.querySelector("#directory-dialog-title").textContent = "Add office / organisation";
    document.querySelector("#directory-order").value = "999";
    document.querySelector("#directory-active").checked = true;
    document.querySelector("#directory-error").textContent = "";
  };

  document.querySelector("#add-directory-button")?.addEventListener("click", () => {
    resetDirectoryForm();
    directoryDialogElement.showModal();
  });

  document.querySelectorAll(".edit-directory-button").forEach((button) => button.addEventListener("click", () => {
    const entity = state.directoryEntities.find((item) => item.id === button.dataset.directoryId);
    if (!entity) return;
    resetDirectoryForm();
    document.querySelector("#directory-dialog-title").textContent = "Edit office / organisation";
    document.querySelector("#directory-id").value = entity.id;
    document.querySelector("#directory-name").value = entity.name || "";
    document.querySelector("#directory-short-name").value = entity.short_name || "";
    document.querySelector("#directory-category").value = entity.category || "other";
    document.querySelector("#directory-email").value = entity.email || "";
    document.querySelector("#directory-phone").value = entity.phone || "";
    document.querySelector("#directory-address").value = entity.address || "";
    document.querySelector("#directory-order").value = entity.display_order ?? 999;
    document.querySelector("#directory-frequent").checked = Boolean(entity.is_frequent);
    document.querySelector("#directory-active").checked = Boolean(entity.is_active);
    document.querySelector("#directory-remarks").value = entity.remarks || "";
    directoryDialogElement.showModal();
  }));

  document.querySelector("#directory-form")?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#directory-save");
    const error = document.querySelector("#directory-error");
    const id = document.querySelector("#directory-id").value;
    const value = (selector) => document.querySelector(selector)?.value?.trim() || null;
    const payload = {
      name: value("#directory-name"),
      short_name: value("#directory-short-name"),
      category: value("#directory-category") || "other",
      email: value("#directory-email"),
      phone: value("#directory-phone"),
      address: value("#directory-address"),
      display_order: Number(document.querySelector("#directory-order").value || 999),
      is_frequent: document.querySelector("#directory-frequent").checked,
      is_active: document.querySelector("#directory-active").checked,
      remarks: value("#directory-remarks"),
    };
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      if (id) await updateDirectoryEntity(id, payload);
      else await createDirectoryEntity(payload);
      directoryDialogElement.close();
      showToast(id ? "Directory entry updated." : "Directory entry added.");
      await renderAdministration();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelectorAll(".toggle-directory-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await updateDirectoryEntity(button.dataset.directoryId, { is_active: button.dataset.nextActive === "true" }); showToast("Directory entry updated."); await renderAdministration(); }
    catch (error) { showToast(error.message, "error"); } finally { setButtonLoading(button, false); }
  }));

  const jurisdictionDialog = document.querySelector("#jurisdiction-dialog");
  document.querySelector("#add-jurisdiction-button")?.addEventListener("click",()=>jurisdictionDialog.showModal());
  document.querySelector("#jurisdiction-form")?.addEventListener("submit",async(event)=>{event.preventDefault();const form=event.currentTarget;if(!form.checkValidity()){form.reportValidity();return;}const button=document.querySelector("#jurisdiction-save");const error=document.querySelector("#jurisdiction-error");setButtonLoading(button,true,"Saving...");error.textContent="";try{await createProjectJurisdiction({user_id:document.querySelector("#jurisdiction-user").value,project_id:document.querySelector("#jurisdiction-project").value,access_type:document.querySelector("#jurisdiction-type").value,can_receive_actions:document.querySelector("#jurisdiction-can-receive").checked,is_active:true});jurisdictionDialog.close();showToast("Project jurisdiction saved.");await renderAdministration();}catch(err){error.textContent=err.message;}finally{setButtonLoading(button,false);}});
  document.querySelectorAll(".remove-jurisdiction-button").forEach((button)=>button.addEventListener("click",async()=>{setButtonLoading(button,true,"Removing...");try{await deactivateProjectJurisdiction(button.dataset.id);showToast("Jurisdiction removed.");await renderAdministration();}catch(error){showToast(error.message,"error");}finally{setButtonLoading(button,false);}}));
}

    return `<article class="correspondence-item">

        ${item.action_required ? `<p class="correspondence-parties"><strong>Action:</strong> ${escapeHtml(item.action_required)}</p>` : ""}

        </div>
      </div>
    </article>`;
  }).join("")}</div>`;
}


function correspondenceOfficeOptions(selected = "") {
  const active = state.directoryEntities.filter((entity) => entity.is_active !== false);
  const frequent = active
    .filter((entity) => entity.is_frequent)
    .sort((a, b) => Number(a.display_order || 999) - Number(b.display_order || 999) || a.name.localeCompare(b.name));
  const others = active
    .filter((entity) => !entity.is_frequent)
    .sort((a, b) => a.name.localeCompare(b.name));

  const option = (entity) => `<option value="${escapeHtml(entity.name)}" ${selected === entity.name ? "selected" : ""}>${escapeHtml(entity.name)}</option>`;
  return `<option value="">Select office/organisation</option>
    ${frequent.length ? `<optgroup label="Frequently used">${frequent.map(option).join("")}</optgroup>` : ""}
    ${others.length ? `<optgroup label="Directory (A–Z)">${others.map(option).join("")}</optgroup>` : ""}
    <option value="__other__" ${selected === "__other__" ? "selected" : ""}>Other</option>`;
}

function bindOtherOfficeFields() {
  [["#corr-from-select", "#corr-from-other"], ["#corr-to-select", "#corr-to-other"]].forEach(([selectId, otherId]) => {
    const select = document.querySelector(selectId);
    const other = document.querySelector(otherId);
    if (!select || !other) return;
    const sync = () => {
      const isOther = select.value === "__other__";
      other.hidden = !isOther;
      const input = other.querySelector("input");
      if (input) {
        input.required = isOther;
        if (!isOther) input.value = "";
      }
    };
    select.addEventListener("change", sync);
    sync();
  });
}

function selectedOfficeValue(selectId, otherInputId) {
  const select = document.querySelector(selectId);
  if (!select) return null;
  if (select.value === "__other__") {
    return document.querySelector(otherInputId)?.value?.trim() || null;
  }
  return select.value || null;
}

function bindCorrespondenceDialogEvents(onSaved) {

  const fileInput = document.querySelector("#corr-attachment-file");

    const file = fileInput.files?.[0];
    try {
      validateCorrespondenceAttachment(file);
      fileInput.setCustomValidity("");

      fileInput.value = "";
      fileInput.setCustomValidity(error.message);
      fileInput.reportValidity();
    }
  });
  const form = document.querySelector("#correspondence-form");
  form?.addEventListener("submit", async (event) => {

    if (!form.checkValidity()) { form.reportValidity(); return; }

    const error = document.querySelector("#correspondence-error");
    const value = (id) => document.querySelector(id)?.value?.trim() || null;
    setButtonLoading(button, true, "Saving..."); error.textContent = "";
    try {
      const created = await createCorrespondence({
        project_id: value("#corr-project"),
        direction: value("#corr-direction"),
        letter_number: value("#corr-number"),
        letter_date: value("#corr-letter-date"),
        received_or_sent_date: value("#corr-movement-date"),
        priority: value("#corr-priority") || "normal",
        from_party: selectedOfficeValue("#corr-from-select", "#corr-from-other-input"),
        to_party: selectedOfficeValue("#corr-to-select", "#corr-to-other-input"),
        subject: value("#corr-subject"),
        reference_details: value("#corr-reference"),
        action_required: value("#corr-action"),
        due_date: value("#corr-due-date"),
        status: value("#corr-status") || "open",
        remarks: value("#corr-remarks"),
      });
      const file = document.querySelector("#corr-attachment-file")?.files?.[0] || null;
      if (file) {
        const attachment = await uploadCorrespondenceAttachment(file, created.project_id, created.id);
        await updateCorrespondence(created.id, attachment);
      }
      document.querySelector("#correspondence-dialog").close();
      showToast(file ? "Correspondence and attachment saved." : "Correspondence saved.");
      await onSaved();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
}

function bindCorrespondenceStatusButtons(onSaved) {

function notificationStateFor(key) {
  return state.notificationStates.find((item) => item.notification_key === key) || null;
}

function buildNotifications() {
  const results = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const currentUserId = state.profile?.id;

  state.actionItems.forEach((action) => {
    if (["completed", "cancelled"].includes(action.status)) return;
    const project = state.projects.find((item) => item.id === action.project_id);
    const projectLabel = project?.project_code || project?.project_name || "Project";
    const assignees = actionAssigneesFor(action.id);
    const assignedToMe = assignees.some((item) => item.user_id === currentUserId);

    if (assignedToMe) {
      results.push({
        key: `assigned:${action.id}:${currentUserId}`,
        type: "assigned",
        title: `Action assigned: ${action.title}`,
        message: `${projectLabel}${action.due_date ? ` · Due ${formatDate(action.due_date)}` : ""}`,
        actionId: action.id,
        projectId: action.project_id,
        sortDate: action.updated_at || action.created_at,
      });
    }

    if (action.due_date && (assignedToMe || canVerifyAction(action) || canControlAction(action))) {
      const due = new Date(`${action.due_date}T00:00:00`);
      const days = Math.round((due - today) / 86400000);
      if (days < 0) {
        results.push({
          key: `overdue:${action.id}:${action.due_date}`,
          type: "overdue",
          title: `Overdue action: ${action.title}`,
          message: `${projectLabel} · Due date was ${formatDate(action.due_date)}`,
          actionId: action.id,
          projectId: action.project_id,
          sortDate: action.due_date,
        });
      } else if (days <= 3) {
        results.push({
          key: `due-soon:${action.id}:${action.due_date}`,
          type: "due_soon",
          title: `Action due ${days === 0 ? "today" : `in ${days} day${days === 1 ? "" : "s"}`}: ${action.title}`,
          message: `${projectLabel} · Due ${formatDate(action.due_date)}`,
          actionId: action.id,
          projectId: action.project_id,
          sortDate: action.due_date,
        });
      }
    }
  });

  state.actionProgressUpdates
    .filter((update) => update.verification_status === "pending")
    .forEach((update) => {
      const action = state.actionItems.find((item) => item.id === update.action_id);
      if (!action || !canVerifyAction(action)) return;
      results.push({
        key: `verification:${update.id}`,
        type: "verification",
        title: `Progress verification pending: ${action.title}`,
        message: `${actionUserName(update.submitted_by)} claimed ${update.claimed_progress_percent}% progress.`,
        actionId: action.id,
        projectId: action.project_id,
        sortDate: update.submitted_at,
      });
    });

  return results
    .map((item) => ({ ...item, state: notificationStateFor(item.key) }))
    .filter((item) => !item.state?.dismissed_at)
    .sort((a, b) => String(b.sortDate || "").localeCompare(String(a.sortDate || "")));
}

function unreadNotificationCount() {
  return (state.notifications || []).filter((item) => !item.state?.read_at && !item.state?.dismissed_at).length;
}

function notificationTypeLabel(type) {
  return ({ assigned: "Assigned action", overdue: "Overdue", due_soon: "Due soon", verification: "Verification" })[type] || type;
}

function notificationIcon(type) {
  return type === "verification" ? "check" : type === "overdue" ? "bell" : type === "due_soon" ? "calendar" : "clipboard";
}

function notificationsTemplate() {
  const unread = unreadNotificationCount();
  return `<div class="app-shell">${appHeader()}${sidebar("")}
    <main class="main-content notification-page">
      <div class="breadcrumb"><span>Dashboard</span><b>/</b>Notifications</div>
      <div class="admin-heading"><div><h1>Notifications and Reminders</h1><p>Assigned actions, due dates, overdue items and progress awaiting verification.</p></div>${unread ? `<button class="btn secondary" id="mark-all-notifications-read">Mark all read</button>` : ""}</div>
      <section class="action-summary-grid">
        <div class="admin-metric"><span>Unread</span><strong>${unread}</strong></div>
        <div class="admin-metric"><span>Total active alerts</span><strong>${state.notifications.length}</strong></div>
        <div class="admin-metric"><span>Overdue alerts</span><strong>${state.notifications.filter((n)=>n.type==="overdue").length}</strong></div>
        <div class="admin-metric"><span>Verification alerts</span><strong>${state.notifications.filter((n)=>n.type==="verification").length}</strong></div>
      </section>
      <section class="admin-card"><div class="admin-card-heading"><div><h2>Notification centre</h2><p>Dismissed alerts remain hidden unless the underlying condition changes.</p></div></div>
        <div style="padding:18px 20px;">

            <div class="notification-icon ${item.type}">${icon(notificationIcon(item.type))}</div>

              <button class="btn secondary notification-dismiss-button" data-key="${escapeHtml(item.key)}">Dismiss</button>
            </div>
          </article>`).join("")}</div>` : `<div class="empty-state">${icon("bell",42)}<h3>No active notifications</h3><p>You are up to date.</p></div>`}

async function renderNotifications() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading notifications...</p></div>`;
  try {
    await loadActionData();
    state.notificationStates = await getNotificationStates();
    state.notifications = buildNotifications();
    root.innerHTML = notificationsTemplate();
    bindNotificationEvents();
  } catch (error) {
    root.innerHTML = `<div class="loading-screen"><p>${escapeHtml(error.message)}</p></div>`;
  }
}

function bindNotificationEvents() {
  bindCommonEvents();
  document.querySelectorAll(".notification-read-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await saveNotificationState(button.dataset.key, { read_at: new Date().toISOString(), dismissed_at: null }); await renderNotifications(); }
    catch (error) { showToast(error.message, "error"); }
  }));
  document.querySelectorAll(".notification-dismiss-button").forEach((button) => button.addEventListener("click", async () => {
    setButtonLoading(button, true, "Saving...");
    try { await saveNotificationState(button.dataset.key, { read_at: new Date().toISOString(), dismissed_at: new Date().toISOString() }); await renderNotifications(); }
    catch (error) { showToast(error.message, "error"); }
  }));
  document.querySelectorAll(".notification-open-button").forEach((button) => button.addEventListener("click", async () => {
    const actionId = button.dataset.actionId;
    await saveNotificationState(
      state.notifications.find((item) => item.actionId === actionId)?.key || `opened:${actionId}`,
      { read_at: new Date().toISOString(), dismissed_at: null }
    ).catch(() => {});
    location.hash = "#actions";
  }));
  document.querySelector("#mark-all-notifications-read")?.addEventListener("click", async (event) => {
    const button = event.currentTarget;
    setButtonLoading(button, true, "Saving...");
    try {
      for (const item of state.notifications.filter((n) => !n.state?.read_at)) {
        await saveNotificationState(item.key, { read_at: new Date().toISOString(), dismissed_at: null });
      }
      await renderNotifications();
    } catch (error) { showToast(error.message, "error"); }
    finally { setButtonLoading(button, false); }
  });
}

function actionStatusLabel(status) {
  return ({ open: "Open", in_progress: "In Progress", awaiting_response: "Awaiting Response", completed: "Completed", cancelled: "Cancelled" })[status] || status || "Open";
}

function actionUserName(userId) {
  const user = state.assignableUsers.find((item) => item.id === userId);
  return user?.full_name || "Unknown user";
}

function actionAssigneesFor(actionId) {
  return state.actionAssignees.filter((item) => item.action_id === actionId && item.is_active);
}

function actionUpdatesFor(actionId) {
  return state.actionProgressUpdates.filter((item) => item.action_id === actionId);
}

function jurisdictionUsersForProject(projectId) {
  const eligibleIds = new Set(state.projectJurisdictions
    .filter((item) => item.project_id === projectId && item.is_active && item.can_receive_actions)
    .map((item) => item.user_id));
  return state.assignableUsers.filter((user) => eligibleIds.has(user.id));
}

function actionTimingClass(item) {
  if (item.status === "completed") return "completed";
  if (!item.due_date) return "";
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(`${item.due_date}T00:00:00`);
  const days = Math.round((due - today) / 86400000);
  if (days < 0) return "overdue";
  if (days <= 3) return "due-soon";
  return "";
}

function canControlAction(item) {
  return state.profile?.role === "admin" || item.assigned_by === state.profile?.id || item.created_by === state.profile?.id;
}

function canSubmitProgress(item) {
  return actionAssigneesFor(item.id).some((assignment) => assignment.user_id === state.profile?.id);
}

function canVerifyAction(item) {
  return state.profile?.role === "admin" || item.verifier_id === state.profile?.id || item.assigned_by === state.profile?.id || item.created_by === state.profile?.id;
}

function progressHistory(item) {
  const updates = actionUpdatesFor(item.id);
  if (!updates.length) return "";
  return `<div class="progress-history">${updates.map((update) => `<div class="progress-update ${update.verification_status}">
    <h4>${escapeHtml(actionUserName(update.submitted_by))} claimed ${update.claimed_progress_percent}% · ${escapeHtml(update.verification_status)}</h4>
    <p><strong>Work done:</strong> ${escapeHtml(update.work_done)}</p>
    ${update.remaining_work ? `<p><strong>Remaining:</strong> ${escapeHtml(update.remaining_work)}</p>` : ""}
    ${update.delay_reason ? `<p><strong>Delay/reason:</strong> ${escapeHtml(update.delay_reason)}</p>` : ""}
    ${update.verification_remarks ? `<p><strong>Verification:</strong> ${escapeHtml(update.verification_remarks)}</p>` : ""}
    ${update.verification_status === "pending" && canVerifyAction(item) ? `<div class="progress-update-actions"><button class="btn secondary verify-progress-button" data-update-id="${update.id}" data-action-id="${item.id}">Review update</button></div>` : ""}
  </div>`).join("")}</div>`;
}

function actionList(items, showProject = true) {
  if (!items.length) return `<div class="empty-state">${icon("clipboard",42)}<h3>No actions recorded</h3><p>Create the first action item and assign responsibility.</p></div>`;
  return `<div class="action-list">${items.map((item) => {
    const project = state.projects.find((p) => p.id === item.project_id);
    const correspondence = state.correspondence.find((c) => c.id === item.correspondence_id);
    const assignees = actionAssigneesFor(item.id);
    const assigneeText = assignees.length ? assignees.map((a) => `${a.responsibility_type === "lead" ? "Lead" : "Supporting"}: ${actionUserName(a.user_id)}`).join(" · ") : "Unassigned";
    return `<article class="action-item ${actionTimingClass(item)}">
      <div>
        <div class="action-topline">
          <span class="priority-pill ${item.priority || "normal"}">${item.priority || "normal"}</span>
          <span class="action-status ${item.status || "open"}">${actionStatusLabel(item.status)}</span>
          ${showProject && project ? `<span class="status-pill approved">${escapeHtml(project.project_code || project.project_name)}</span>` : ""}
          ${correspondence ? `<span class="status-pill pending">Letter: ${escapeHtml(correspondence.letter_number || correspondence.subject || "Linked")}</span>` : ""}
        </div>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="action-meta"><span>${escapeHtml(assigneeText)}</span>${item.verifier_id ? `<span>Verifier: ${escapeHtml(actionUserName(item.verifier_id))}</span>` : ""}${item.due_date ? `<span>Due: ${formatDate(item.due_date)}</span>` : `<span>No due date</span>`}</div>
        ${item.description ? `<p class="action-description">${escapeHtml(item.description)}</p>` : ""}
        <div class="progress-track" aria-label="${Number(item.verified_progress_percent || 0)} percent verified"><span style="width:${Number(item.verified_progress_percent || 0)}%"></span></div>
        ${progressHistory(item)}
      </div>
      <div class="action-side">
        ${(() => {
          const updates = actionUpdatesFor(item.id);
          const latest = updates.length ? updates[0] : null;
          const latestClaimed = latest ? Number(latest.claimed_progress_percent || 0) : Number(item.verified_progress_percent || 0);
          return `<strong>Claimed: ${latestClaimed}% | Verified: ${Number(item.verified_progress_percent || 0)}%</strong>`;
        })()}
        <span>Only verified progress is treated as official.</span>
        ${canControlAction(item) ? `<button class="btn secondary edit-action-button" data-action-id="${item.id}">Edit instruction</button>` : ""}
        ${canSubmitProgress(item) ? `<button class="btn primary submit-progress-button" data-action-id="${item.id}">Submit progress</button>` : ""}
      </div>
    </article>`;
  }).join("")}</div>`;
}

    overdue: items.filter((i)=>i.due_date && !["completed","cancelled"].includes(i.status) && new Date(`${i.due_date}T00:00:00`) < today).length,

}

  const users = jurisdictionUsersForProject(projectId);
  picker.innerHTML = users.length ? users.map((user, index)=>{
    const existing = selected.find((item)=>item.user_id === user.id);
    return `<label class="assignee-option"><input type="checkbox" class="assignee-checkbox" value="${user.id}" ${existing?"checked":""}/><span><strong>${escapeHtml(user.full_name)} — ${escapeHtml(user.designation || "User")}</strong><span>${escapeHtml(user.office_name || "Office not specified")}</span><select class="assignee-role" data-user-id="${user.id}" ${existing?"":"disabled"}><option value="lead" ${existing?.responsibility_type === "lead"?"selected":""}>Lead</option><option value="supporting" ${existing?.responsibility_type !== "lead"?"selected":""}>Supporting</option></select><input class="assignee-note" data-user-id="${user.id}" placeholder="Individual responsibility" value="${escapeHtml(existing?.responsibility_note || "")}" ${existing?"":"disabled"}/></span></label>`;
  }).join("") : `<p class="form-error">No approved officer currently has jurisdiction for this project. Add project jurisdiction in Administration first.</p>`;

async function renderWorkspace(projectId) {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Opening project workspace...</p></div>`;
  let project;
  if (state.demo) project = state.projects.find((item) => item.id === projectId);
  else {
    try {
      [project, state.correspondence, state.actionItems, state.assignableUsers, state.projectJurisdictions, state.actionAssignees, state.actionProgressUpdates] = await Promise.all([getProject(projectId), getCorrespondence(projectId), getActionItems(projectId), getAssignableUsers(), getProjectJurisdictions(), getActionAssignees(), getActionProgressUpdates()]);
    } catch (error) { showToast(error.message, "error"); }
  }
  root.innerHTML = workspaceTemplate(project);
  bindCommonEvents();
  document.querySelector("#back-to-register")?.addEventListener("click", () => { location.hash = "#projects"; });
  document.querySelectorAll(".tab").forEach((button) => button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));

    const target = document.querySelector("#workspace-tab-content");
    const key = button.dataset.tab;

      : key === "correspondence" ? projectCorrespondenceModule(project)

      : key === "documents" ? emptyModule("No documents uploaded", "Store agreements, approvals, drawings, reports and orders in this workspace.", "document")
      : emptyModule("Project timeline", "Milestones and key events will be shown chronologically here.", "timeline");
    if (key === "actions") {
      bindActionEvents(async () => {
        state.actionItems = await getActionItems(project.id);
        document.querySelector("#workspace-tab-content").innerHTML = projectActionsModule(project);
        bindActionEvents(async () => { location.hash = `#project/${project.id}`; });
      });
    }
    if (key === "correspondence") {
      document.querySelector("#add-project-correspondence")?.addEventListener("click", () => document.querySelector("#correspondence-dialog").showModal());
      bindCorrespondenceDialogEvents(async () => {
        state.correspondence = await getCorrespondence(project.id);
        document.querySelector("#workspace-tab-content").innerHTML = projectCorrespondenceModule(project);
        document.querySelector("#add-project-correspondence")?.addEventListener("click", () => document.querySelector("#correspondence-dialog").showModal());
        bindCorrespondenceDialogEvents(async () => { location.hash = `#project/${project.id}`; });
        bindCorrespondenceStatusButtons(async () => { location.hash = `#project/${project.id}`; });
      });
      bindCorrespondenceStatusButtons(async () => {
        state.correspondence = await getCorrespondence(project.id);
        document.querySelector("#workspace-tab-content").innerHTML = projectCorrespondenceModule(project);
      });
    }
  }));
}

function bindLoginEvents() {
  const form = document.querySelector("#login-form");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#login-button");
    const error = document.querySelector("#login-error");
    setButtonLoading(button, true, "Signing in...");
    error.textContent = "";
    try {
      state.session = await signIn(document.querySelector("#login-email").value.trim(), document.querySelector("#login-password").value);
      await loadAuthenticatedData();
      location.hash = "#projects";
      renderRegister();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
  const signupDialog = document.querySelector("#signup-dialog");
  let verifiedSignupSession = null;
  let verifiedSignupEmail = "";
  document.querySelector("#open-signup").addEventListener("click", () => signupDialog.showModal());
  const closeSignup = (event) => { event.preventDefault(); event.stopPropagation(); signupDialog.close(); };
  document.querySelector("#signup-close-button")?.addEventListener("click", closeSignup);
  document.querySelector("#signup-cancel-button")?.addEventListener("click", closeSignup);

  const setSignupPasswordEnabled = (enabled) => {
    ["#signup-password", "#signup-password-confirm", "#toggle-signup-password", "#toggle-signup-password-confirm", "#signup-button"].forEach((selector) => {
      const element = document.querySelector(selector);
      if (element) element.disabled = !enabled;
    });
  };

  const resetEmailVerification = () => {
    verifiedSignupSession = null;
    verifiedSignupEmail = "";
    setSignupPasswordEnabled(false);
    document.querySelectorAll(".otp-box").forEach((box) => { box.value = ""; });
    const combinedOtp = document.querySelector("#signup-otp");
    if (combinedOtp) combinedOtp.value = "";
    const status = document.querySelector("#email-verification-status");
    if (status) status.textContent = "Verify your email before creating a password.";
  };
  document.querySelector("#signup-email")?.addEventListener("input", resetEmailVerification);

  const otpBoxes = [...document.querySelectorAll(".otp-box")];
  const syncOtpValue = () => {
    const value = otpBoxes.map((box) => box.value).join("");
    const combined = document.querySelector("#signup-otp");
    if (combined) combined.value = value;
    return value;
  };
  otpBoxes.forEach((box, index) => {
    box.addEventListener("input", (event) => {
      const digit = event.target.value.replace(/\D/g, "").slice(-1);
      event.target.value = digit;
      syncOtpValue();
      if (digit && index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
    });
    box.addEventListener("keydown", (event) => {
      if (event.key === "Backspace" && !box.value && index > 0) {
        otpBoxes[index - 1].focus();
      }
      if (event.key === "ArrowLeft" && index > 0) otpBoxes[index - 1].focus();
      if (event.key === "ArrowRight" && index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
    });
    box.addEventListener("paste", (event) => {
      event.preventDefault();
      const digits = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, otpBoxes.length);
      if (!digits) return;
      otpBoxes.forEach((item, itemIndex) => { item.value = digits[itemIndex] || ""; });
      syncOtpValue();
      otpBoxes[Math.min(digits.length, otpBoxes.length) - 1].focus();
    });
  });

  const bindPasswordToggle = (buttonId, inputId) => {
    const button = document.querySelector(buttonId);
    const input = document.querySelector(inputId);
    button?.addEventListener("click", () => {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      button.textContent = showing ? "Show" : "Hide";
      button.setAttribute("aria-pressed", String(!showing));
    });
  };
  bindPasswordToggle("#toggle-signup-password", "#signup-password");
  bindPasswordToggle("#toggle-signup-password-confirm", "#signup-password-confirm");

  document.querySelector("#send-otp-button")?.addEventListener("click", async () => {
    const name = document.querySelector("#signup-name");
    const designation = document.querySelector("#signup-designation");
    const email = document.querySelector("#signup-email");
    const error = document.querySelector("#signup-error");
    [name, designation, email].forEach((field) => field?.setCustomValidity(""));
    if (!name.value.trim() || !designation.value || !email.checkValidity()) {
      if (!name.value.trim()) name.setCustomValidity("Enter your full name.");
      if (!designation.value) designation.setCustomValidity("Select your designation.");
      if (!email.checkValidity()) email.setCustomValidity("Enter a valid email address.");
      document.querySelector("#signup-form").reportValidity();
      return;
    }
    const button = document.querySelector("#send-otp-button");
    setButtonLoading(button, true, "Sending...");
    error.textContent = "";
    resetEmailVerification();
    try {
      await sendEmailOtp({ email: email.value.trim(), fullName: name.value.trim(), designation: designation.value });
      document.querySelector("#otp-section").hidden = false;
      document.querySelector("#email-verification-status").textContent = "A verification code has been sent. Check your inbox and spam folder.";
      otpBoxes[0]?.focus();
      showToast("Verification code sent.");
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelector("#verify-otp-button")?.addEventListener("click", async () => {
    const email = document.querySelector("#signup-email");
    const otp = document.querySelector("#signup-otp");
    const error = document.querySelector("#signup-error");
    const otpValue = syncOtpValue();
    if (!/^\d{8}$/.test(otpValue)) {
      error.textContent = "Enter all 8 digits of the verification code.";
      const firstEmpty = otpBoxes.find((box) => !box.value);
      (firstEmpty || otpBoxes[0])?.focus();
      return;
    }
    const button = document.querySelector("#verify-otp-button");
    setButtonLoading(button, true, "Verifying...");
    error.textContent = "";
    try {
      const result = await verifyEmailOtp({ email: email.value.trim(), token: otpValue });
      if (!result.access_token) throw new Error("Email verification did not return a valid session.");
      verifiedSignupSession = result;
      verifiedSignupEmail = email.value.trim().toLowerCase();
      email.readOnly = true;
      document.querySelector("#send-otp-button").disabled = true;
      document.querySelector("#otp-section").hidden = true;
      document.querySelector("#email-verification-status").textContent = "Email verified successfully. You may now create your password.";
      setSignupPasswordEnabled(true);
      document.querySelector("#signup-password").focus();
      showToast("Email verified successfully.");
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  const clearPasswordValidation = () => {
    document.querySelector("#signup-password")?.setCustomValidity("");
    document.querySelector("#signup-password-confirm")?.setCustomValidity("");
  };
  document.querySelector("#signup-password")?.addEventListener("input", clearPasswordValidation);
  document.querySelector("#signup-password-confirm")?.addEventListener("input", clearPasswordValidation);

  document.querySelector("#signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const formElement = event.currentTarget;
    const email = document.querySelector("#signup-email");
    const password = document.querySelector("#signup-password");
    const confirmPassword = document.querySelector("#signup-password-confirm");
    const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
    if (!verifiedSignupSession || verifiedSignupEmail !== email.value.trim().toLowerCase()) {
      document.querySelector("#signup-error").textContent = "Verify your email before creating the account.";
      return;
    }
    password.setCustomValidity(strongPassword.test(password.value) ? "" : "Password must contain at least one uppercase letter, one lowercase letter, one number and one special character.");
    confirmPassword.setCustomValidity(password.value === confirmPassword.value ? "" : "Passwords do not match.");
    if (!formElement.checkValidity()) { formElement.reportValidity(); return; }
    const button = document.querySelector("#signup-button");
    const error = document.querySelector("#signup-error");
    setButtonLoading(button, true, "Creating..."); error.textContent = "";
    try {
      await setVerifiedUserPassword({
        session: verifiedSignupSession,
        password: password.value,
        fullName: document.querySelector("#signup-name").value.trim(),
        designation: document.querySelector("#signup-designation").value,
      });
      state.session = verifiedSignupSession;
      signupDialog.close();
      showToast("Account created and email verified.");
      await loadAuthenticatedData();
      location.hash = "#projects";
      renderRegister();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
  document.querySelector("#toggle-login-password")?.addEventListener("click", (event) => {
    const input = document.querySelector("#login-password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    event.currentTarget.textContent = showing ? "Show" : "Hide";
    event.currentTarget.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });

  document.querySelector("#preview-button").addEventListener("click", () => { location.href = "./?demo=1#projects"; });
}

async function loadAuthenticatedData() {
  [state.profile, state.projects, state.highways, state.offices, state.directoryEntities] = await Promise.all([getProfile(), getProjects(), getHighways(), getOffices(), getDirectoryEntities()]);
  [state.actionItems, state.assignableUsers, state.projectJurisdictions, state.actionAssignees, state.actionProgressUpdates, state.notificationStates] = await Promise.all([
    getActionItems(), getAssignableUsers(), getProjectJurisdictions(), getActionAssignees(), getActionProgressUpdates(), getNotificationStates()
  ]);
  state.notifications = buildNotifications();
}

async function route() {
  const hash = location.hash || "#projects";
  if (hash === "#admin") return renderAdministration();
  if (hash === "#correspondence") return renderGlobalCorrespondence();
  if (hash === "#actions") return renderActionPage();
  if (hash === "#notifications") return renderNotifications();
  const match = hash.match(/^#project\/(.+)$/);
  if (match) return renderWorkspace(match[1]);
  renderRegister();
}

async function init() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading MARGDARSHI...</p></div>`;
  if (state.demo) {
    state.profile = DEMO_PROFILE;
    state.projects = DEMO_PROJECTS;
    state.highways = [];
    state.offices = [];
    state.loading = false;
    return route();
  }
  state.session = await ensureSession();
  if (!state.session) {
    root.innerHTML = loginTemplate();
    bindLoginEvents();
    return;
  }
  try {
    await loadAuthenticatedData();
    state.loading = false;
    route();
  } catch (error) {
    root.innerHTML = loginTemplate();
    bindLoginEvents();
    document.querySelector("#login-error").textContent = error.message;
  }
}

document.addEventListener("click", (event) => {
  const closeButton = event.target.closest("[data-dialog-close]");
  if (!closeButton) return;
  event.preventDefault();
  event.stopPropagation();
  const dialog = closeButton.closest("dialog");
  if (dialog) dialog.close();
}, true);

window.addEventListener("hashchange", () => { if (state.session || state.demo) route(); });
init();

</script>
</body>
</html>
