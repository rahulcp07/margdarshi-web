  }));
  const correspondenceResults=(state.correspondence||[]).filter(c=>includes(c.subject,c.letter_number,c.from_party,c.to_party,c.status)).map(c=>({
    type:"Correspondence",title:c.subject||"Untitled correspondence",detail:`${c.letter_number||"No letter number"} · ${reportProjectName(c.project_id)}`,date:formatDate(c.letter_date),route:"#correspondence",recordId:c.id
  }));
  const actionResults=(state.actionItems||[]).filter(a=>includes(a.title,a.description,a.priority,a.status)).map(a=>({
    type:"Action",title:a.title,detail:`${reportProjectName(a.project_id)} · ${actionStatusLabel(a.status)}`,date:a.due_date?`Due ${formatDate(a.due_date)}`:"",route:`#action/${encodeURIComponent(a.id)}`,recordId:a.id
  }));
  const inspectionResults=(state.inspections||[]).filter(i=>includes(i.inspection_type,i.observations,i.location_description,i.severity,i.status,chainageLabel(i))).map(i=>({
    type:"Inspection",title:`${(i.inspection_type||"general").replaceAll("_"," ")} inspection`,detail:`${reportProjectName(i.project_id)} · ${chainageLabel(i)}`,date:formatDate(i.inspection_date),route:"#inspections",recordId:i.id
  }));
  return [...projectResults,...correspondenceResults,...actionResults,...inspectionResults].slice(0,24);
}


function highlightExactRecord(row){
  row.scrollIntoView({behavior:"smooth",block:"center"});
  row.classList.add("search-highlight");
  setTimeout(()=>row.classList.remove("search-highlight"),3500);
}

function openExactSearchRecord(type,id,options={}){
  if(!id){
    if(options.notifyOnFailure) dashboardNavigationFallback(options.fallbackRoute);
    return;
  }
  const attempts=12;
  let count=0;
  const tryOpen=()=>{
    count+=1;
    try{
      if(type==="Action"){
        const item=state.actionItems.find(record=>String(record.id)===String(id));
        if(item&&typeof openActionDetails==="function"){
          openActionDetails(id);
          return;
        }
        const row=[...document.querySelectorAll("[data-action-record-id]")].find(element=>String(element.dataset.actionRecordId)===String(id));
        if(row){
          highlightExactRecord(row);
          return;
        }
      }
      if(type==="Correspondence"){
        const item=state.correspondence.find(record=>String(record.id)===String(id));
        const editButton=[...document.querySelectorAll(".edit-correspondence-button[data-id]")].find(element=>String(element.dataset.id)===String(id));
        const row=[...document.querySelectorAll("[data-correspondence-id]")].find(element=>String(element.dataset.correspondenceId)===String(id));
        if(row){highlightExactRecord(row);return;}
        if(editButton){editButton.click();return;}
        if(item&&typeof openCorrespondenceModal==="function"){openCorrespondenceModal(item);return;}
      }
      if(type==="Inspection"){
        const editButton=[...document.querySelectorAll(".edit-inspection-button[data-id]")].find(element=>String(element.dataset.id)===String(id));
        const row=[...document.querySelectorAll("[data-inspection-id]")].find(element=>String(element.dataset.inspectionId)===String(id));
        if(row){highlightExactRecord(row);return;}
        if(editButton){editButton.click();return;}
        const item=state.inspections.find(record=>String(record.id)===String(id));
        if(item&&typeof openInspectionModal==="function"){openInspectionModal(item);return;}
      }
    }catch(error){}
    if(count<attempts){
      setTimeout(tryOpen,180);
      return;
    }
    if(options.notifyOnFailure) dashboardNavigationFallback(options.fallbackRoute);
  };
  setTimeout(tryOpen,120);
}

function renderGlobalSearchResults(items){
  const box=document.querySelector("#global-search-results");
  if(!box)return;
  globalSearchActiveIndex=-1;
  if(!items.length){
    box.innerHTML=`<div class="global-search-empty">No matching records found.</div>`;
    box.hidden=false;
    return;
  }
  const groups=["Project","Correspondence","Action","Inspection"];
  box.innerHTML=groups.map(group=>{
    const rows=items.filter(item=>item.type===group);
    if(!rows.length)return"";
    return`<div class="global-search-section">${group}</div>${rows.map(item=>`<button class="global-search-result" data-route="${item.route}" data-record-type="${item.type}" data-record-id="${item.recordId||""}"><div><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.detail)}</span></div><small>${escapeHtml(item.date||item.type)}</small></button>`).join("")}`;
  }).join("");
  box.hidden=false;
  box.querySelectorAll(".global-search-result").forEach(button=>button.addEventListener("click",()=>{
    const recordType=button.dataset.recordType;
    const recordId=button.dataset.recordId;
    box.hidden=true;
    document.querySelector("#global-search-input").value="";
    if(recordType==="Action"){
      openActionDetails(recordId);
      return;
    }
    location.hash=button.dataset.route;
    route();
    if(recordType!=="Project") openExactSearchRecord(recordType,recordId);
  }));
}

async function runGlobalSearch(){
  const input=document.querySelector("#global-search-input");
  const box=document.querySelector("#global-search-results");
  if(!input||!box)return;
  const query=input.value.trim();
  if(query.length<2){box.hidden=true;box.innerHTML="";return;}
  box.hidden=false;
  box.innerHTML=`<div class="global-search-empty">Searching...</div>`;
  try{
    await ensureGlobalSearchData();
    renderGlobalSearchResults(globalSearchItems(query));
  }catch(error){
    box.innerHTML=`<div class="global-search-empty">${escapeHtml(error.message)}</div>`;
  }
}

function bindGlobalSearch(){
  const input=document.querySelector("#global-search-input");
  const box=document.querySelector("#global-search-results");
  if(!input||!box)return;
  input.addEventListener("input",()=>{
    clearTimeout(globalSearchTimer);
    globalSearchTimer=setTimeout(runGlobalSearch,220);
  });
  input.addEventListener("keydown",(event)=>{
    const results=[...box.querySelectorAll(".global-search-result")];
    if(event.key==="ArrowDown"&&results.length){
      event.preventDefault();globalSearchActiveIndex=(globalSearchActiveIndex+1)%results.length;
    }else if(event.key==="ArrowUp"&&results.length){
      event.preventDefault();globalSearchActiveIndex=(globalSearchActiveIndex-1+results.length)%results.length;
    }else if(event.key==="Enter"&&globalSearchActiveIndex>=0&&results[globalSearchActiveIndex]){
      event.preventDefault();results[globalSearchActiveIndex].click();return;
    }else if(event.key==="Escape"){
      box.hidden=true;input.blur();return;
    }else{return;}
    results.forEach((item,index)=>item.classList.toggle("active",index===globalSearchActiveIndex));
    results[globalSearchActiveIndex]?.scrollIntoView({block:"nearest"});
  });
  document.addEventListener("click",(event)=>{
    if(!event.target.closest(".global-search")) box.hidden=true;
  },{once:true});
}

function bindCommonEvents() {
  bindGlobalSearch();
  document.querySelector("#notification-button")?.addEventListener("click", () => { location.hash = "#notifications"; });
  document.querySelector("#logout-button")?.addEventListener("click", async () => {
    if (state.demo) { location.href = "./"; return; }
    await signOut();
    location.hash = "";
    await init();
  });
  const activeRoutes = {
    dashboard: "#dashboard",
    projects: "#projects",
    correspondence: "#correspondence",
    actions: "#actions",
    inspections: "#inspections",
    calendar: "#calendar",
    reports: "#reports",
  };

  document.querySelectorAll(".nav-item").forEach((button) => {
    button.addEventListener("click", () => {
      const nav = button.dataset.nav;
      if (nav === "admin") {
        if (state.profile?.role !== "admin") {
          showToast("Administrator access is required.", "error");
          return;
        }
        location.hash = "#admin";
        return;
      }
      if (nav === "actions") {
        openActionRegisterView("all");
        return;
      }
      if (activeRoutes[nav]) {
        location.hash = activeRoutes[nav];
        route();
        return;
      }
      showToast(`${button.textContent.trim()} will be activated in the next module.`, "info");
    });
  });
}

  const rerenderRows = () => {
    document.querySelector("#project-table").innerHTML = `${projectRows(filteredProjects())}<div class="table-footer">Showing ${filteredProjects().length} of ${state.projects.length} projects</div>`;
    bindRowEvents();
  };
  document.querySelector("#project-search")?.addEventListener("input", (event) => { state.filters.query = event.target.value; rerenderRows(); });

  document.querySelector("#status-filter")?.addEventListener("change", (event) => { state.filters.status = event.target.value; rerenderRows(); });
  document.querySelector("#office-filter")?.addEventListener("change", (event) => { state.filters.office = event.target.value; rerenderRows(); });

    state.filters = { query: "", highway: "all", status: "all", office: "all" };

function bindRowEvents() {
  document.querySelectorAll("tr[data-project-id]").forEach((row) => {
    const open = (event) => {
      if (event.target.closest("button")) return;
      location.hash = `#project/${row.dataset.projectId}`;
    };
    row.addEventListener("click", open);
    row.addEventListener("keydown", (event) => { if (event.key === "Enter") open(event); });

async function handleCreateProject(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const button = document.querySelector("#save-project-button");
  const error = document.querySelector("#project-error");
  setButtonLoading(button, true, "Saving...");
  error.textContent = "";
  try {
    const valueOrNull = (id) => document.querySelector(id)?.value?.trim() || null;
    await createProject({
      project_name: valueOrNull("#project-name"), project_code: valueOrNull("#project-code"), mode: valueOrNull("#project-mode"),
      highway_id: valueOrNull("#project-highway"), implementing_office_id: valueOrNull("#project-office"), status: valueOrNull("#project-status"),
      start_chainage_km: valueOrNull("#project-start-chainage"), end_chainage_km: valueOrNull("#project-end-chainage"),
      sanctioned_cost_crore: valueOrNull("#project-cost"), scheduled_completion_date: valueOrNull("#project-completion"), description: valueOrNull("#project-description"),
    });
    document.querySelector("#project-dialog").close();
    state.projects = await getProjects();
    renderRegister();
    showToast(`Project “${valueOrNull("#project-name") || "New project"}” was created successfully.`);
  } catch (err) {
    error.textContent = err.message;
  } finally { setButtonLoading(button, false); }
}

function renderRegister() {
  root.innerHTML = projectRegisterTemplate();
  bindRegisterEvents();
}

function bindLoginEvents() {
  const form = document.querySelector("#login-form");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const button = document.querySelector("#login-button");
    const error = document.querySelector("#login-error");
    setButtonLoading(button, true, "Signing in...");
    error.textContent = "";
    try {
      state.session = await signIn(document.querySelector("#login-email").value.trim(), document.querySelector("#login-password").value);
      await loadAuthenticatedData();
      location.hash = "#projects";
      renderRegister();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
  const signupDialog = document.querySelector("#signup-dialog");
  let verifiedSignupSession = null;
  let verifiedSignupEmail = "";
  document.querySelector("#open-signup").addEventListener("click", () => signupDialog.showModal());
  const closeSignup = (event) => { event.preventDefault(); event.stopPropagation(); signupDialog.close(); };
  document.querySelector("#signup-close-button")?.addEventListener("click", closeSignup);
  document.querySelector("#signup-cancel-button")?.addEventListener("click", closeSignup);

  const setSignupPasswordEnabled = (enabled) => {
    ["#signup-password", "#signup-password-confirm", "#toggle-signup-password", "#toggle-signup-password-confirm", "#signup-button"].forEach((selector) => {
      const element = document.querySelector(selector);
      if (element) element.disabled = !enabled;
    });
  };

  const resetEmailVerification = () => {
    verifiedSignupSession = null;
    verifiedSignupEmail = "";
    setSignupPasswordEnabled(false);
    document.querySelectorAll(".otp-box").forEach((box) => { box.value = ""; });
    const combinedOtp = document.querySelector("#signup-otp");
    if (combinedOtp) combinedOtp.value = "";
    const status = document.querySelector("#email-verification-status");
    if (status) status.textContent = "Verify your email before creating a password.";
  };
  document.querySelector("#signup-email")?.addEventListener("input", resetEmailVerification);

  const otpBoxes = [...document.querySelectorAll(".otp-box")];
  const syncOtpValue = () => {
    const value = otpBoxes.map((box) => box.value).join("");
    const combined = document.querySelector("#signup-otp");
    if (combined) combined.value = value;
    return value;
  };
  otpBoxes.forEach((box, index) => {
    box.addEventListener("input", (event) => {
      const digit = event.target.value.replace(/\D/g, "").slice(-1);
      event.target.value = digit;
      syncOtpValue();
      if (digit && index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
    });
    box.addEventListener("keydown", (event) => {
      if (event.key === "Backspace" && !box.value && index > 0) {
        otpBoxes[index - 1].focus();
      }
      if (event.key === "ArrowLeft" && index > 0) otpBoxes[index - 1].focus();
      if (event.key === "ArrowRight" && index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
    });
    box.addEventListener("paste", (event) => {
      event.preventDefault();
      const digits = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, otpBoxes.length);
      if (!digits) return;
      otpBoxes.forEach((item, itemIndex) => { item.value = digits[itemIndex] || ""; });
      syncOtpValue();
      otpBoxes[Math.min(digits.length, otpBoxes.length) - 1].focus();
    });
  });

  const bindPasswordToggle = (buttonId, inputId) => {
    const button = document.querySelector(buttonId);
    const input = document.querySelector(inputId);
    button?.addEventListener("click", () => {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      button.textContent = showing ? "Show" : "Hide";
      button.setAttribute("aria-pressed", String(!showing));
    });
  };
  bindPasswordToggle("#toggle-signup-password", "#signup-password");
  bindPasswordToggle("#toggle-signup-password-confirm", "#signup-password-confirm");

  document.querySelector("#send-otp-button")?.addEventListener("click", async () => {
    const name = document.querySelector("#signup-name");
    const designation = document.querySelector("#signup-designation");
    const email = document.querySelector("#signup-email");
    const error = document.querySelector("#signup-error");
    [name, designation, email].forEach((field) => field?.setCustomValidity(""));
    if (!name.value.trim() || !designation.value || !email.checkValidity()) {
      if (!name.value.trim()) name.setCustomValidity("Enter your full name.");
      if (!designation.value) designation.setCustomValidity("Select your designation.");
      if (!email.checkValidity()) email.setCustomValidity("Enter a valid email address.");
      document.querySelector("#signup-form").reportValidity();
      return;
    }
    const button = document.querySelector("#send-otp-button");
    setButtonLoading(button, true, "Sending...");
    error.textContent = "";
    resetEmailVerification();
    try {
      await sendEmailOtp({ email: email.value.trim(), fullName: name.value.trim(), designation: designation.value });
      document.querySelector("#otp-section").hidden = false;
      document.querySelector("#email-verification-status").textContent = "A verification code has been sent. Check your inbox and spam folder.";
      otpBoxes[0]?.focus();
      showToast("Verification code sent.");
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  document.querySelector("#verify-otp-button")?.addEventListener("click", async () => {
    const email = document.querySelector("#signup-email");
    const otp = document.querySelector("#signup-otp");
    const error = document.querySelector("#signup-error");
    const otpValue = syncOtpValue();
    if (!/^\d{8}$/.test(otpValue)) {
      error.textContent = "Enter all 8 digits of the verification code.";
      const firstEmpty = otpBoxes.find((box) => !box.value);
      (firstEmpty || otpBoxes[0])?.focus();
      return;
    }
    const button = document.querySelector("#verify-otp-button");
    setButtonLoading(button, true, "Verifying...");
    error.textContent = "";
    try {
      const result = await verifyEmailOtp({ email: email.value.trim(), token: otpValue });
      if (!result.access_token) throw new Error("Email verification did not return a valid session.");
      verifiedSignupSession = result;
      verifiedSignupEmail = email.value.trim().toLowerCase();
      email.readOnly = true;
      document.querySelector("#send-otp-button").disabled = true;
      document.querySelector("#otp-section").hidden = true;
      document.querySelector("#email-verification-status").textContent = "Email verified successfully. You may now create your password.";
      setSignupPasswordEnabled(true);
      document.querySelector("#signup-password").focus();
      showToast("Email verified successfully.");
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });

  const clearPasswordValidation = () => {
    document.querySelector("#signup-password")?.setCustomValidity("");
    document.querySelector("#signup-password-confirm")?.setCustomValidity("");
  };
  document.querySelector("#signup-password")?.addEventListener("input", clearPasswordValidation);
  document.querySelector("#signup-password-confirm")?.addEventListener("input", clearPasswordValidation);

  document.querySelector("#signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const formElement = event.currentTarget;
    const email = document.querySelector("#signup-email");
    const password = document.querySelector("#signup-password");
    const confirmPassword = document.querySelector("#signup-password-confirm");
    const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
    if (!verifiedSignupSession || verifiedSignupEmail !== email.value.trim().toLowerCase()) {
      document.querySelector("#signup-error").textContent = "Verify your email before creating the account.";
      return;
    }
    password.setCustomValidity(strongPassword.test(password.value) ? "" : "Password must contain at least one uppercase letter, one lowercase letter, one number and one special character.");
    confirmPassword.setCustomValidity(password.value === confirmPassword.value ? "" : "Passwords do not match.");
    if (!formElement.checkValidity()) { formElement.reportValidity(); return; }
    const button = document.querySelector("#signup-button");
    const error = document.querySelector("#signup-error");
    setButtonLoading(button, true, "Creating..."); error.textContent = "";
    try {
      await setVerifiedUserPassword({
        session: verifiedSignupSession,
        password: password.value,
        fullName: document.querySelector("#signup-name").value.trim(),
        designation: document.querySelector("#signup-designation").value,
      });
      state.session = verifiedSignupSession;
      signupDialog.close();
      showToast("Account created and email verified.");
      await loadAuthenticatedData();
      location.hash = "#projects";
      renderRegister();
    } catch (err) { error.textContent = err.message; }
    finally { setButtonLoading(button, false); }
  });
  document.querySelector("#toggle-login-password")?.addEventListener("click", (event) => {
    const input = document.querySelector("#login-password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    event.currentTarget.textContent = showing ? "Show" : "Hide";
    event.currentTarget.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });

  document.querySelector("#preview-button").addEventListener("click", () => { location.href = "./?demo=1#projects"; });
}

async function loadAuthenticatedData() {
  [state.profile, state.projects, state.highways, state.offices, state.directoryEntities] = await Promise.all([getProfile(), getProjects(), getHighways(), getOffices(), getDirectoryEntities()]);
  [state.actionItems, state.assignableUsers, state.projectJurisdictions, state.actionAssignees, state.actionProgressUpdates, state.notificationStates] = await Promise.all([
    getActionItems(), getAssignableUsers(), getProjectJurisdictions(), getActionAssignees(), getActionProgressUpdates(), getNotificationStates()
  ]);
  state.notifications = buildNotifications();
}


document.addEventListener("keydown",(event)=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){
    event.preventDefault();
    const input=document.querySelector("#global-search-input");
    if(input){input.focus();input.select();}
  }
});

async function route() {
  const hash = location.hash || "#dashboard";
  if (hash === "#dashboard") return renderDashboard();
  if (hash === "#admin") return renderAdministration();
  if (hash === "#correspondence") return renderGlobalCorrespondence();
  if (hash === "#actions") return renderActionPage();
  if (hash === "#notifications") return renderNotifications();
  if (hash === "#calendar") return renderCalendar();
  if (hash === "#inspections") return renderInspections();
  if (hash === "#reports") return renderReports();
  const actionMatch = hash.match(/^#action\/(.+)$/);
  if (actionMatch) {
    try { return renderActionDetail(decodeURIComponent(actionMatch[1])); }
    catch (error) { return renderActionDetail(""); }
  }
  const match = hash.match(/^#project\/(.+)$/);
  if (match) return renderWorkspace(match[1]);
  renderRegister();
}

async function init() {
  root.innerHTML = `<div class="loading-screen"><span class="spinner dark"></span><p>Loading MARGDARSHI...</p></div>`;
  if (state.demo) {
    state.profile = DEMO_PROFILE;
    state.projects = DEMO_PROJECTS;
    state.highways = [];
    state.offices = [];
    state.loading = false;
    return route();
  }
  state.session = await ensureSession();
  if (!state.session) {
    root.innerHTML = loginTemplate();
    bindLoginEvents();
    return;
  }
  try {
    await loadAuthenticatedData();
    state.loading = false;
    route();
  } catch (error) {
    root.innerHTML = loginTemplate();
    bindLoginEvents();
    document.querySelector("#login-error").textContent = error.message;
  }
}

document.addEventListener("click", (event) => {
  const closeButton = event.target.closest("[data-dialog-close]");
  if (!closeButton) return;
  event.preventDefault();
  event.stopPropagation();
  const dialog = closeButton.closest("dialog");
  if (dialog) dialog.close();
}, true);

window.addEventListener("hashchange", () => { if (state.session || state.demo) route(); });
init();

</script>
